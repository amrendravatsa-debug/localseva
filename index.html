<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c2410c">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>हाज़िर</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--g1:#c2410c;--g2:#f97316;--ink:#2a1d14;--mut:#7a6a5e;--bg:#fff8f1;--line:#f0e2d3;--bad:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(84px + env(safe-area-inset-bottom));font-size:15px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;min-height:100vh}
button{font:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
.mut{color:var(--mut)}

/* hero */
.hero{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:calc(env(safe-area-inset-top) + 22px) 20px 60px;border-radius:0 0 34px 34px;position:relative}
.hero.small{padding-bottom:44px}
.hero .hello{opacity:.9;font-size:14px}
.hero h1{font-size:25px;line-height:1.3;margin:6px 0 18px;font-weight:700}
.hero p{opacity:.9;margin-top:4px}
.search{display:flex;gap:10px;align-items:center;background:#fff;border-radius:18px;padding:13px 16px;color:var(--ink);box-shadow:0 10px 26px rgba(0,0,0,.14)}
.search input{border:0;outline:0;flex:1;font:inherit;background:transparent;min-width:0;width:auto;margin:0;padding:0;border-radius:0}
.rf{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 18px);background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:12px;width:40px;height:40px;font-size:20px}

.brandrow{display:flex;align-items:center;gap:10px;margin-bottom:12px}.brandrow svg{width:34px;height:34px;flex:none}.brandrow b{font-size:20px;letter-spacing:.2px}.brandrow small{display:block;opacity:.9;font-size:12px;margin-top:-2px}
.vach{display:flex;gap:14px;align-items:center;margin-top:12px;background:#fff;border-radius:22px;padding:16px 18px;box-shadow:0 6px 18px rgba(42,29,20,.07);cursor:pointer}.vach .pe{font-size:30px}.vach p{color:var(--mut);font-size:13px}.vach span{margin-left:auto;font-size:22px;color:var(--g1)}
.vl{list-style:none;padding:0;margin:10px 0 4px}.vl li{display:flex;gap:12px;margin:12px 0}.vl .n{flex:none;width:30px;height:30px;border-radius:10px;background:#ffeedd;color:var(--g1);font-weight:700;display:flex;align-items:center;justify-content:center}.vl b{display:block}.vl small{color:var(--mut)}
.pad{padding:16px}
.pad.up{margin-top:-32px;position:relative;z-index:1}

/* services grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.svc{border:0;border-radius:24px;padding:20px 12px 16px;color:var(--ink);text-align:center;box-shadow:0 6px 18px rgba(42,29,20,.08);transition:transform .15s}
.svc:active{transform:scale(.96)}
.svc .em{font-size:40px;line-height:1.1;margin-bottom:8px}
.svc b{display:block;font-size:16px}
.svc small{display:block;color:var(--mut);margin-top:2px;font-size:12px}

.promo{display:flex;gap:14px;align-items:center;margin-top:18px;background:#2b1d14;color:#fff;border-radius:22px;padding:18px}
.promo .pe{font-size:34px}
.promo p{opacity:.8;font-size:13px;margin-top:2px}
.cta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;background:#fff;border:1.5px dashed var(--g2);border-radius:22px;padding:16px 18px;cursor:pointer}
.cta p{color:var(--mut);font-size:13px}
.cta span{font-size:22px;color:var(--g1)}
.install{display:flex;justify-content:space-between;align-items:center;background:#ffeedd;border-radius:18px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.install button{border:0;background:var(--g1);color:#fff;border-radius:12px;padding:8px 14px;font-weight:700}

/* topbar + detail */
.topbar{position:sticky;top:0;z-index:5;background:rgba(255,248,241,.92);backdrop-filter:blur(8px);display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px}
.topbar h2{font-size:19px}
.back{width:42px;height:42px;border-radius:14px;border:0;background:#fff;box-shadow:0 3px 10px rgba(42,29,20,.1);font-size:20px}
.dh{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;text-align:center;padding:calc(env(safe-area-inset-top) + 16px) 20px 54px;border-radius:0 0 34px 34px;position:relative}
.dh .back{position:absolute;left:16px;top:calc(env(safe-area-inset-top) + 14px);background:rgba(255,255,255,.22);color:#fff;box-shadow:none}
.dh .big{width:92px;height:92px;border-radius:30px;background:#fff;margin:14px auto 12px;display:flex;align-items:center;justify-content:center;font-size:48px;box-shadow:0 10px 24px rgba(0,0,0,.18)}
.dh h2{font-size:22px}
.dh p{opacity:.92;margin-top:4px}
.info{background:#fff;border-radius:20px;padding:14px 16px;margin-bottom:12px;box-shadow:0 4px 14px rgba(42,29,20,.06)}
.info small{color:var(--mut);display:block}
.info b{font-size:18px;color:var(--g1)}

/* cards */
.pc{display:flex;align-items:center;gap:14px;background:#fff;border-radius:22px;padding:14px;margin-bottom:12px;box-shadow:0 6px 18px rgba(42,29,20,.07);cursor:pointer}
.pc:active{transform:scale(.99)}
.av{width:58px;height:58px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.pi{flex:1;min-width:0;display:flex;flex-direction:column}
.pi b{font-size:16px}
.pi span{color:var(--mut);font-size:13px}
.pi .rate{color:var(--g1);font-weight:700;margin-top:2px}
.chev{font-size:26px;color:#9db0a6}
.bc{background:#fff;border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 6px 18px rgba(42,29,20,.07)}
.bc .r1{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.bc .r1 b{font-size:16px}
.bc div.l{color:var(--mut);font-size:14px}
.bc .t{font-size:12px;color:#a8998c;margin-top:6px}
.badge{font-size:12px;font-weight:700;border-radius:99px;padding:4px 12px;white-space:nowrap}
.b-new{background:#fff1cf;color:#8a5a00}.b-ok{background:#dcecff;color:#14509b}.b-done{background:#d9f6e8;color:#0a6b46}.b-no{background:#fde2e2;color:#9b1c1c}.b-here{background:#ece4ff;color:#5b2fa8}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.mini{border:0;border-radius:12px;padding:9px 14px;font-weight:700;font-size:13px;background:var(--g1);color:#fff;text-decoration:none;display:inline-block}
.mini.o{background:#fff;color:var(--g1);border:1.5px solid var(--line)}
.mini.r{background:#fff;color:var(--bad);border:1.5px solid #f5c6c6}
h3.sec{font-size:17px;margin:20px 0 10px}
.empty{text-align:center;padding:40px 20px;color:var(--mut)}
.empty .e{font-size:54px;margin-bottom:8px}

/* buttons + inputs */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:18px;padding:15px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 10px 22px rgba(194,65,12,.30);margin-top:12px;text-decoration:none;font-size:15px}
.btn.wa{background:#25d366;box-shadow:0 10px 22px rgba(37,211,102,.28)}
.btn.ghost{background:#fff;color:var(--g1);box-shadow:none;border:1.5px solid var(--line)}
.btn.dark{background:#2b1d14;box-shadow:0 10px 22px rgba(43,29,20,.25)}
label{display:block;font-weight:500;font-size:14px;margin-top:4px}
input,textarea,select{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);font:inherit;background:#fff;margin:6px 0 12px;outline:0;color:var(--ink)}
input:focus,textarea:focus,select:focus{border-color:var(--g2)}
.card{background:#fff;border-radius:24px;padding:20px;box-shadow:0 10px 28px rgba(42,29,20,.08)}

/* onboarding */
.ob{padding:calc(env(safe-area-inset-top) + 40px) 22px 30px;text-align:center}
.ob .logo{width:92px;height:92px;border-radius:30px;margin:0 auto 14px;background:linear-gradient(135deg,var(--g1),var(--g2));display:flex;align-items:center;justify-content:center;font-size:48px;box-shadow:0 14px 30px rgba(194,65,12,.38)}
.ob h1{font-size:28px}
.ob p{color:var(--mut);margin:6px 0 26px}
.ob .card{text-align:left}
.ob small{display:block;color:var(--mut);margin-top:16px}

/* switch */
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sw input{display:none}
.sw .tg{width:52px;height:30px;border-radius:99px;background:#ccd8d1;position:relative;transition:.2s;flex:none}
.sw .tg::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.sw input:checked+.tg{background:var(--g2)}
.sw input:checked+.tg::after{left:25px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#fff;display:flex;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;box-shadow:0 -8px 28px rgba(42,29,20,.1);z-index:10}
.nav button{flex:1;border:0;background:transparent;border-radius:16px;padding:8px 4px;color:var(--mut);font-size:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button span{font-size:22px;line-height:1.1}
.nav button.on{background:#ffeedd;color:var(--g1);font-weight:700}

/* sheet / toast */
#bg{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:.25s;z-index:20}
#bg.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#fff;border-radius:28px 28px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s;z-index:30;max-height:90vh;overflow:auto}
#sheet.on{transform:none}
#sheet h3{font-size:19px;margin-bottom:10px}
#toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px);background:#10231a;color:#fff;padding:12px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:88vw;text-align:center;font-size:14px}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* skeleton */
.sk{height:84px;border-radius:22px;margin-bottom:12px;background:linear-gradient(90deg,#e6eee9 25%,#f3f8f5 50%,#e6eee9 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;color:var(--mut);gap:10px;text-align:center;padding:24px}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid #d5e4dc;border-top-color:var(--g1);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.vb{display:inline-block;background:#e0f5ea;color:#0a6b46;border-radius:99px;padding:1px 8px;font-size:11px;font-weight:700;margin-left:6px;vertical-align:middle}
.rt{color:#b7791f;font-weight:700;font-size:13px}
.chat{display:flex;flex-direction:column;gap:8px;margin:10px 0;max-height:42vh;overflow:auto}
.bub{max-width:88%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.5}
.bub.bot{background:#fff1e3;align-self:flex-start;border-bottom-left-radius:5px}
.bub.me{background:var(--g1);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.bub.deal{background:#d9f6e8;color:#0a6b46;font-weight:700}
.bz{display:flex;gap:8px;align-items:center}.bz input{margin:0;flex:1}.bz button{flex:none;border:0;border-radius:14px;padding:13px 16px;background:var(--g1);color:#fff;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tag{display:inline-block;background:#fff1cf;color:#8a5a00;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;margin-left:6px}
.chk{display:flex;align-items:center;gap:10px;margin:6px 0 12px;font-weight:500}
.chk input{width:22px;height:22px;margin:0;flex:none}
.stars{display:flex;gap:6px;justify-content:center;margin:10px 0 16px}
.stars button{border:0;background:transparent;font-size:38px;line-height:1;color:#d3dcd7;padding:0}
.stars button.on{color:#f5b301}
.rv{border-top:1px solid var(--line);padding:10px 0;font-size:14px;color:var(--ink);font-weight:400}
code{background:#eef3f0;padding:2px 6px;border-radius:6px;font-size:13px}
/* AI सहायक */
.bub{white-space:pre-line}
.search .mic{flex:none;border:0;background:#ffeedd;border-radius:50%;width:38px;height:38px;font-size:18px;padding:0}
.mic.live,.mic2.live{animation:pulse 1s infinite;background:#fca5a5!important}
.bz .mic2{background:#ffeedd;color:var(--g1);padding:13px 14px}
@keyframes pulse{50%{transform:scale(1.12)}}
.aic{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#2b1d14,#7c2d12);color:#fff;border-radius:22px;padding:16px 18px;margin-bottom:14px;cursor:pointer;box-shadow:0 10px 26px rgba(124,45,18,.35)}
.aic p{opacity:.85;font-size:13px;margin-top:2px}
.aic>span{margin-left:auto;font-size:24px}
.orb{flex:none;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#fdba74 40%,#f97316);box-shadow:0 0 22px rgba(249,115,22,.8);animation:breath 2.4s ease-in-out infinite}
@keyframes breath{50%{transform:scale(1.1);box-shadow:0 0 32px rgba(249,115,22,.95)}}
.nudge{display:flex;gap:12px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:12px 16px;margin-bottom:14px;cursor:pointer}
.nudge .ne{font-size:28px}.nudge small{display:block;color:var(--mut)}.nudge .go{margin-left:auto;color:var(--g1);font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--g1);border-radius:99px;padding:8px 14px;font-weight:700;font-size:13px}
.bub.typing i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--g1);opacity:.35;animation:blink 1s infinite}
.bub.typing i:nth-child(2){animation-delay:.2s}.bub.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.orb,.mic.live,.mic2.live,.bub.typing i{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="bg" onclick="closeSheet()"></div>
<div id="sheet"></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ============ 1) अपना Firebase कॉन्फ़िग यहाँ चिपकाएँ ============ */
const firebaseConfig = {
  apiKey: "AIzaSyB-29KKb2LFFPLk_bQfG0QYz2Mnc_iU-mQ",
  authDomain: "localsewa-1c042.firebaseapp.com",
  projectId: "localsewa-1c042",
  appId: "1:724416769552:web:5aa75ee46bd0c1c9c02495"
};
/* ================================================================ */

const SUPPORT_WA = ''; // शिकायत/सहायता के WhatsApp नंबर (देश कोड सहित, जैसे 919XXXXXXXXX)। खाली हो तो बटन छिपा रहेगा।
const LOGO = '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M50 12C33 12 20 25 20 42c0 20 22 38 30 46 8-8 30-26 30-46C80 25 67 12 50 12z" fill="#fff"/><path d="M37 43l9 9 17-18" fill="none" stroke="#c2410c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CONFIGURED = !!firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf('YOUR_') !== 0;

const SERVICES = [
  {key:'barber', name:'नाई (घर पर)', emoji:'💈', bg:'#fde8ef', hint:'कटिंग, दाढ़ी, मसाज'},
  {key:'plumber', name:'प्लंबर', emoji:'🔧', bg:'#e3f0ff', hint:'नल, पाइप, टंकी'},
  {key:'electrician', name:'इलेक्ट्रीशियन', emoji:'💡', bg:'#fff4d6', hint:'वायरिंग, पंखा, मरम्मत'},
  {key:'laundry', name:'लॉन्ड्री', emoji:'🧺', bg:'#e2f6ee', hint:'धुलाई, प्रेस, पिकअप'},
  {key:'dairy', name:'बल्क दूध-दही', emoji:'🥛', bg:'#eaecff', hint:'शादी-ब्याह के लिए थोक'},
  {key:'pandit', name:'पंडित जी', emoji:'🙏', bg:'#fff0e0', hint:'पूजा, कथा, मुहूर्त, गृह-प्रवेश'},
  {key:'appliance', name:'AC / फ्रिज / मशीन', emoji:'❄️', bg:'#e0f4ff', hint:'इंस्टॉलेशन और मरम्मत'},
  {key:'tent', name:'टेंट-कैटरिंग', emoji:'🎪', bg:'#f3e8ff', hint:'शादी, पार्टी, भोज'},
  {key:'mistri', name:'मिस्त्री / कारपेंटर', emoji:'🔨', bg:'#f1ece4', hint:'मरम्मत, फर्नीचर, पेंट'},
  {key:'cleaning', name:'घर की सफ़ाई', emoji:'🧹', bg:'#e6f7ef', hint:'सफ़ाई, टंकी, कीट-नियंत्रण'},
  {key:'beauty', name:'ब्यूटीशियन', emoji:'💄', bg:'#ffe6f2', hint:'मेकअप, फेशियल, दुल्हन श्रृंगार'},
  {key:'maid', name:'मेड / घरेलू सहायिका', emoji:'🧼', bg:'#e8f1ff', hint:'झाड़ू-पोछा, बर्तन, खाना'},
  {key:'banquet', name:'बैंक्वेट हॉल', emoji:'🏛️', bg:'#fff1d9', hint:'पार्टी, रिसेप्शन, सगाई'},
  {key:'marriage', name:'मैरेज हॉल', emoji:'💒', bg:'#ffe9e9', hint:'शादी, विवाह भवन, लॉन'},
  {key:'hotel', name:'लोकल होटल / लॉज', emoji:'🏨', bg:'#e7f7f0', hint:'कमरे, मेहमानों का ठहराव'}
];
const SC = {'नया':'b-new','स्वीकार':'b-ok','हाज़िर':'b-here','पूरा':'b-done','रद्द':'b-no'};

const $ = s => document.querySelector(s);
const svc = k => SERVICES.find(s => s.key === k) || SERVICES[0];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ms = ts => (ts && ts.toMillis) ? ts.toMillis() : 0;
const fmt = ts => {
  if (!ts || !ts.toDate) return '';
  try { return ts.toDate().toLocaleString('hi-IN', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}); }
  catch (e) { return ''; }
};
function loadProfile(){ try { return JSON.parse(localStorage.getItem('ls_profile') || 'null'); } catch (e) { return null; } }
function saveProfile(p){ try { localStorage.setItem('ls_profile', JSON.stringify(p)); } catch (e) {} S.profile = p; }

const S = {tab:'home', view:null, uid:null, profile:loadProfile(), cache:{}, installEv:null, rate:{}, bk:{}, reviewed:{}, rv:null, bg:null, deal:null, ai:null};
let auth = null, db = null;

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}
function sheet(html){ $('#sheet').innerHTML = html; $('#sheet').classList.add('on'); $('#bg').classList.add('on'); }
function closeSheet(){ $('#sheet').classList.remove('on'); $('#bg').classList.remove('on'); S.ai = null; try { speechSynthesis.cancel(); } catch (e) {} }

/* ---------- नेविगेशन ---------- */
function setTab(t){ S.tab = t; S.view = null; render(); window.scrollTo(0, 0); }
function go(view, params){ S.view = {view, params}; history.pushState({v:1}, ''); render(); window.scrollTo(0, 0); }
function back(){ history.back(); }
window.addEventListener('popstate', () => { S.view = null; closeSheet(); render(); });

function shell(inner, withNav){
  $('#app').innerHTML = '<div class="wrap">' + inner + '</div>' + (withNav === false ? '' : navHTML());
}
function navHTML(){
  const items = [['home','🏠','सेवाएँ'],['bookings','🧾','मेरी बुकिंग'],['pro','🧑‍🔧','प्रोवाइडर']];
  return '<nav class="nav">' + items.map(i =>
    '<button class="' + (S.tab === i[0] ? 'on' : '') + '" onclick="setTab(\'' + i[0] + '\')"><span>' + i[1] + '</span>' + i[2] + '</button>'
  ).join('') + '</nav>';
}
const skeleton = n => Array.from({length:n}, () => '<div class="sk"></div>').join('');
const emptyHTML = (e, t) => '<div class="empty"><div class="e">' + e + '</div>' + t + '</div>';
const errHTML = () => emptyHTML('⚠️', 'डेटा लोड नहीं हो पाया।<br>इंटरनेट देखें और दोबारा कोशिश करें।<br><button class="btn ghost" onclick="render()">दोबारा कोशिश करें</button>');

/* ---------- मुख्य रेंडर ---------- */
function render(){
  if (!CONFIGURED) return setupScreen();
  if (!S.profile) return onboardScreen();
  if (!S.uid) { $('#app').innerHTML = '<div class="center"><div class="spin"></div>जुड़ रहे हैं…</div>'; return; }
  if (S.view) {
    if (S.view.view === 'list') return viewList(S.view.params);
    if (S.view.view === 'detail') return viewDetail(S.view.params);
  }
  closeSheet();
  if (S.tab === 'home') return viewHome();
  if (S.tab === 'bookings') return viewBookings();
  return viewPro();
}

/* ---------- प्रोवाइडर लिस्ट ---------- */
function stars(n){ n = Math.max(0, Math.min(5, Number(n) || 0)); return '★★★★★'.slice(0, n) + '☆☆☆☆☆'.slice(0, 5 - n); }
function ratingOf(pid){ const r = S.rate[pid]; return r && r.n ? {avg:r.sum / r.n, n:r.n} : null; }
function ratingHTML(pid){ const r = ratingOf(pid); return r ? '<span class="rt">★ ' + r.avg.toFixed(1) + ' (' + r.n + ')</span>' : '<span class="mut">नया</span>'; }
function canBargain(p){ return p && p.bargain === true && Number(p.pMin) > 0 && Number(p.pMax) >= Number(p.pMin); }
function up5(x){ return Math.ceil(x / 5) * 5; }
/* नियम-आधारित मोलभाव: तीन दौर; हर दौर की स्वीकार-सीमा घटती है, तीसरे में न्यूनतम */
function bargainReply(p, o, round){
  const mn = Number(p.pMin), mx = Number(p.pMax), R = mx - mn;
  const T = [Math.min(mx, up5(mn + 0.5 * R)), Math.min(mx, up5(mn + 0.25 * R)), mn];
  const thr = T[Math.min(round, 3) - 1];
  if (o >= thr) return {deal:true, price:Math.min(o, mx), final:false};
  const counter = Math.max(mn, thr);
  return {deal:false, counter:counter, final:round >= 3, low:o < mn};
}
function pcard(p){
  const s = svc(p.service);
  return '<article class="pc" onclick="go(\'detail\',\'' + esc(p.id) + '\')"><div class="av" style="background:' + s.bg + '">' + s.emoji + '</div>' +
    '<div class="pi"><b>' + esc(p.name) + (p.verified === true ? '<span class="vb">✔ जाँचा हुआ</span>' : '') + '</b><span>📍 ' + esc(p.area) + ' • ' + ratingHTML(p.id) + '</span><span class="rate">' + esc(p.rate) + (canBargain(p) ? '<span class="tag">💬 मोलभाव ₹' + p.pMin + '–' + p.pMax + '</span>' : '') + '</span></div><span class="chev">›</span></article>';
}
async function viewList(key){
  const s = svc(key);
  shell('<div class="topbar"><button class="back" onclick="back()">←</button><h2>' + s.emoji + ' ' + s.name + '</h2></div><section class="pad" id="content">' + skeleton(3) + '</section>', false);
  try {
    const res = await Promise.all([
      db.collection('providers').where('service', '==', key).where('active', '==', true).get(),
      db.collection('reviews').where('service', '==', key).get().catch(() => null)
    ]);
    const docs = res[0].docs.map(d => Object.assign({id:d.id}, d.data()));
    S.rate = {};
    if (res[1]) res[1].docs.forEach(d => {
      const r = d.data(); const e = S.rate[r.providerId] || (S.rate[r.providerId] = {sum:0, n:0});
      e.sum += Number(r.rating) || 0; e.n += 1;
    });
    docs.forEach(d => { S.cache[d.id] = d; });
    const score = p => { const r = ratingOf(p.id); return (p.verified === true ? 10 : 0) + (r ? r.avg : 0); };
    docs.sort((a, b) => (score(b) - score(a)) || (ms(b.createdAt) - ms(a.createdAt)));
    if (!(S.view && S.view.view === 'list' && S.view.params === key)) return;
    $('#content').innerHTML = docs.length ? docs.map(pcard).join('') :
      emptyHTML(s.emoji, 'अभी इस सेवा में कोई प्रोवाइडर नहीं है।<br>आप पहले बनें! <b>प्रोवाइडर</b> टैब में रजिस्टर करें।');
  } catch (e) {
    if ($('#content')) $('#content').innerHTML = errHTML();
  }
}

    (canBargain(p) ? '<button class="btn" onclick="bargainOpen(\'' + esc(id) + '\')">💬 मोलभाव करें (ऑटो-सहायक)</button>' : '') +
    '<button class="btn ' + (canBargain(p) ? 'ghost' : '') + '" onclick="startVideo(\'' + esc(id) + '\')">🎥 वीडियो कॉल पर रेट तय करें</button>' +

function bargainOpen(id){
  const p = S.cache[id]; if (!canBargain(p)) return;
  S.bg = {id:id, round:0, first:null, msgs:[{w:'bot', t:'नमस्ते 🙏 मैं ' + p.name + ' का ऑटो-सहायक हूँ। रेट ₹' + p.pMax + ' है, पर आपकी बात बन सकती है। आप कितना देना चाहेंगे?'}], done:null, counter:null};
  bargainRender();
}
function bargainRender(){
  const b = S.bg, p = S.cache[b.id];
  let foot;
  if (b.done) {
    foot = '<button class="btn" onclick="bargainBook()">📅 ₹' + b.done + ' में बुक करें</button>';
  } else {
    foot = (b.counter ? '<div class="two"><button class="btn" style="margin-top:0" onclick="bargainAccept()">✔ ₹' + b.counter + ' मंज़ूर</button><button class="btn ghost" style="margin-top:0" onclick="startVideo(\'' + esc(b.id) + '\')">🎥 वीडियो पर बात</button></div><div style="height:10px"></div>' : '') +
      '<div class="bz"><input id="bz_in" type="tel" inputmode="numeric" maxlength="6" placeholder="आपका भाव ₹"><button onclick="bargainSend()">भेजें</button></div>';
  }
  sheet('<h3>💬 मोलभाव: ' + esc(p.name) + '</h3><div class="chat" id="chat">' +
    b.msgs.map(m => '<div class="bub ' + m.w + (m.deal ? ' deal' : '') + '">' + m.t + '</div>').join('') + '</div>' + foot +
    '<p class="mut" style="font-size:12px;margin-top:10px">यह ऑटो-सहायक है। अंतिम सहमति कारीगर की बुकिंग स्वीकार करने पर ही मानी जाएगी।</p>');
  const c = $('#chat'); if (c) c.scrollTop = c.scrollHeight;
}
function bargainSend(){
  const b = S.bg, p = S.cache[b.id];
  const o = Number(($('#bz_in').value || '').replace(/\D/g, ''));
  if (!o || o < 1) return toast('अपना भाव लिखें');
  b.round += 1; if (b.first === null) b.first = o;
  b.msgs.push({w:'me', t:'₹' + o});
  const r = bargainReply(p, o, b.round);
  if (r.deal) {
    b.done = r.price; b.counter = null;
    b.msgs.push({w:'bot', deal:true, t:'सौदा पक्का! 🎉 ₹' + r.price + ' में काम हो जाएगा।'});
  } else if (r.final) {
    b.counter = r.counter;
    b.msgs.push({w:'bot', t:'₹' + o + ' में नहीं हो पाएगा। मेरा आख़िरी भाव ₹' + r.counter + ' है, इससे नीचे नहीं जा सकते।'});
  } else {
    b.counter = r.counter;
    const lines = b.round === 1 ? ['₹' + o + ' थोड़ा कम है। ₹' + r.counter + ' में कर देते हैं?'] : ['चलिए, थोड़ा और कम करते हैं: ₹' + r.counter + '।'];
    b.msgs.push({w:'bot', t:lines[0]});
  }
  bargainRender();
}
function bargainAccept(){
  const b = S.bg;
  b.msgs.push({w:'me', t:'₹' + b.counter + ' मंज़ूर'});
  b.done = b.counter; b.counter = null;
  b.msgs.push({w:'bot', deal:true, t:'सौदा पक्का! 🎉 ₹' + b.done + ' में काम हो जाएगा।'});
  bargainRender();
}
function bargainBook(){

  S.deal = {id:b.id, price:b.done, rounds:b.round, first:b.first};

}

    '<button class="btn" id="b_go" onclick="sendBooking(\'' + esc(id) + '\')">बुकिंग भेजें</button>');

async function sendBooking(id){
  const p = S.cache[id];
  const address = $('#b_addr').value.trim(), when = $('#b_when').value.trim(), note = $('#b_note').value.trim();
  const bulk = $('#b_bulk').checked, qty = $('#b_qty').value.trim(), offerRaw = ($('#b_offer').value || '').replace(/\D/g, '');
  if (!address || !when) return toast('पता और समय ज़रूर भरें');
  if (bulk && !qty) return toast('मात्रा लिखें, जैसे: 100 लीटर');
  const deal = (S.deal && S.deal.id === id) ? S.deal : null;
  const offer = deal ? deal.price : (offerRaw ? Number(offerRaw) : null);
  $('#b_go').disabled = true;
  try {
    await db.collection('bookings').add({
      customerId:S.uid, customerName:S.profile.name, customerPhone:S.profile.phone,
      providerId:id, providerName:p.name, providerPhone:p.phone, service:p.service,
      address:address, when:when, note:note, bulk:bulk, qty:bulk ? qty : '', offer:offer, status:'नया',
      bargained:!!deal, bargainRounds:deal ? deal.rounds : 0, firstOffer:deal ? deal.first : null,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });

/* ---------- AI सहायक (आवाज़ + समझ + मोलभाव + बुकिंग) ---------- */
/* यह ऐप के अंदर चलने वाला नियम-आधारित सहायक है: मुफ़्त, बिना सर्वर और बिना API कुंजी के। */
const nz = s => String(s == null ? '' : s).normalize('NFD').replace(/़/g, '').toLowerCase();
function has(t, w){
  const star = w.slice(-1) === '*'; if (star) w = w.slice(0, -1);
  w = nz(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const latin = /^[a-z0-9 ]+$/.test(w);
  const re = latin ? '(^|[^a-z0-9])' + w + (star ? '' : '(?![a-z0-9])')
                   : '(^|[^\\u0900-\\u097F])' + w + (star ? '' : '(?![\\u0915-\\u0939\\u0958-\\u095F\\u094D])');
  return new RegExp(re).test(t);
}
const KW = {
  barber:['नाई','बाल','बालों','कटिंग','दाढ़ी','हजामत','सैलून','हेयर','शेव','haircut','barber'],
  plumber:['नल','पाइप','प्लंबर','लीक*','टपक*','बाथरूम','टोंटी','टंकी','नाली','फ्लश'],
  electrician:['बिजली','पंखा','वायरिंग','स्विच','इलेक्ट्रीशियन','बल्ब','करंट','इन्वर्टर','मीटर','लाइट','शॉर्ट'],
  laundry:['कपड़े','कपड़ा','धुलाई','प्रेस','लॉन्ड्री','इस्त्री','धोबी'],
  dairy:['दूध','दही','डेयरी','पनीर','घी','छाछ','लस्सी'],
  pandit:['पंडित','पूजा','कथा','मुहूर्त','गृह प्रवेश','गृहप्रवेश','सत्यनारायण','हवन','पाठ','जनेऊ','श्राद्ध'],
  appliance:['ac','एसी','फ्रिज','वॉशिंग','मशीन','कूलर','टीवी','गीजर','रेफ्रिजरेटर'],
  tent:['टेंट','कैटरिंग','भोज','हलवाई','पंडाल','शामियाना','डेकोरेशन'],
  mistri:['मिस्त्री','कारपेंटर','फर्नीचर','पेंट','रंग','दरवाजा','ताला','खिड़की','टाइल','प्लास्टर'],
  cleaning:['सफाई','सफाइ','कीट','दीमक','मच्छर','कॉकरोच','सैनिटाइज','टंकी की सफाई','टंकी सफाई'],
  beauty:['ब्यूटी','ब्यूटीशियन','मेकअप','फेशियल','दुल्हन','श्रृंगार','पार्लर','वैक्स','थ्रेडिंग','मेहंदी'],
  maid:['मेड','बाई','झाड़ू','पोछा','बर्तन','घरेलू','कामवाली'],
  banquet:['बैंक्वेट','पार्टी हॉल','रिसेप्शन','सगाई','बर्थडे','हॉल'],
  marriage:['मैरेज हॉल','मैरेज','विवाह भवन','शादी का हॉल','लॉन','धर्मशाला'],
  hotel:['होटल','लॉज','कमरा','कमरे','ठहरना','रुकना']
};
const BULK_SVC = ['dairy','tent','banquet','marriage','hotel'];
const BULK_WORDS = ['शादी','ब्याह','बारात','भोज','पार्टी','थोक','बल्क','विवाह'];
const HN = {'एक':1,'दो':2,'तीन':3,'चार':4,'पांच':5,'पाँच':5,'छह':6,'छः':6,'सात':7,'आठ':8,'नौ':9,'दस':10,'ग्यारह':11,'बारह':12};

function detectService(raw){
  const t = nz(raw); let best = null, sc = 0;
  for (const k in KW) { let c = 0; KW[k].forEach(w => { if (has(t, w)) c++; }); if (c > sc) { sc = c; best = k; } }
  return best;
}
function parseWhen(raw){
  const t = nz(raw), p = [];
  ['अभी','आज','कल','परसों'].forEach(w => { if (has(t, w)) p.push(w); });
  ['सुबह','दोपहर','शाम','रात'].forEach(w => { if (has(t, w)) p.push(w); });
  const m = t.match(/(\d{1,2})\s*बजे/);
  if (m) p.push(m[1] + ' बजे');
  else for (const k in HN) { if (has(t, k + ' बजे')) { p.push(HN[k] + ' बजे'); break; } }
  return p.join(' ');
}
function parseQty(raw){
  const m = nz(raw).match(/(\d+)\s*(लीटर|ltr|kg|किलो|लोग|मेहमान|आदमी|पैकेट|प्लेट|कमरे|कमरा)/);
  return m ? m[1] + ' ' + m[2] : '';
}
function parsePrice(raw){
  const t = nz(raw);
  let m = t.match(/(?:₹|रुपये|रुपए|रुपया|रु\.?|rs\.?)\s*(\d{2,6})/) || t.match(/(\d{2,6})\s*(?:₹|रुपये|रुपए|रुपया|रु\b|rs\b)/);
  return m ? Number(m[1]) : 0;
}
function isBulk(raw){ const t = nz(raw); return BULK_WORDS.some(w => has(t, w)); }

  if (!SR) return toast('इस ब्राउज़र में आवाज़ नहीं चलती। Chrome में खोलें।');
  try { if (REC) REC.stop(); } catch (e) {}
  const r = new SR(); REC = r;
  r.lang = 'hi-IN'; r.interimResults = false; r.maxAlternatives = 1;
  if (btn) btn.classList.add('live');
  toast('🎤 बोलिए…');
  r.onresult = e => { const t = e.results[0] && e.results[0][0] && e.results[0][0].transcript; if (t) onText(t); };
  r.onerror = e => { toast(e.error === 'not-allowed' ? 'माइक की अनुमति दें' : 'सुन नहीं पाया, दोबारा बोलें'); };
  r.onend = () => { if (btn) btn.classList.remove('live'); if (REC === r) REC = null; };
  try { r.start(); } catch (e) {}
}
function speak(t){
  const a = S.ai; if (!a || !a.voice || !('speechSynthesis' in window)) return;
  try {
    const clean = String(t).replace(/₹\s*(\d+)/g, '$1 रुपये').replace(/[\u{1F300}-\u{1FAFF}☀-➿•✅✔]/gu, '').replace(/\n+/g, '। ');
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(clean); u.lang = 'hi-IN'; u.rate = 1;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function voiceHome(btn){ listen(t => aiOpen(t), btn); }

/* ---------- मौसम के हिसाब से सुझाव ---------- */
function nudge(){
  const m = new Date().getMonth() + 1;
  if (m >= 11 || m <= 2) return {e:'💒', t:'शादी का सीज़न चल रहा है', s:'दूध-दही, टेंट और हॉल अभी बुक करें', q:'शादी के लिए 100 लीटर दूध चाहिए'};
  if (m >= 3 && m <= 6) return {e:'❄️', t:'गर्मी आ रही है', s:'AC और कूलर की सर्विस अभी करवाएँ', q:'AC की सर्विस करवानी है'};
  return {e:'🔧', t:'बरसात का मौसम', s:'टंकी, नल और बिजली की जाँच करवाएँ', q:'टंकी की सफाई करवानी है'};
}
function nudgeHTML(){
  const n = nudge();
  return '<div class="nudge" onclick="aiOpen(nudge().q)"><span class="ne">' + n.e + '</span><div><b>' + n.t + '</b><small>' + n.s + '</small></div><span class="go">→</span></div>';
}

/* ---------- चैट की बुनियाद ---------- */
const EXAMPLES = ['कल सुबह घर पर नाई चाहिए', 'नल टपक रहा है', 'शादी के लिए 100 लीटर दूध', 'AC की सर्विस करवानी है'];
function addBub(w, t, extra){
  const c = $('#chat'); if (!c) return null;
  const d = document.createElement('div'); d.className = 'bub ' + w + (extra ? ' ' + extra : '');
  d.textContent = t; c.appendChild(d); c.scrollTop = c.scrollHeight; return d;
}
async function botSay(t, extra){
  const a = S.ai, c = $('#chat'); if (!c) return;
  const d = document.createElement('div'); d.className = 'bub bot typing'; d.innerHTML = '<i></i><i></i><i></i>';
  c.appendChild(d); c.scrollTop = c.scrollHeight;
  await sleep(350 + Math.min(String(t).length * 6, 600));
  if (S.ai !== a || !d.isConnected) return;
  d.className = 'bub bot' + (extra ? ' ' + extra : ''); d.textContent = t; c.scrollTop = c.scrollHeight; speak(t);
}
function setChips(list){
  const el = $('#ai_chips'); if (!el) return;
  el.innerHTML = '';
  list.forEach(x => { const b = document.createElement('button'); b.className = 'chip'; b.textContent = x.t; b.onclick = x.fn; el.appendChild(b); });
}
const exChips = () => EXAMPLES.map(t => ({t:t, fn:() => aiHandle(t)}));
async function aiRun(fn){
  const a = S.ai; if (!a || a.busy) return;
  a.busy = true;
  try { await fn(a); } catch (e) { console.error(e); } finally { if (S.ai === a) a.busy = false; }
}

function aiOpen(pre){
  const first = (S.profile.name || '').split(' ')[0];
  S.ai = {svc:null, provs:null, p:null, when:'', addr:'', qty:'', bulk:false, budget:0, price:undefined, deal:null, stage:'need', voice:false, busy:false, intro:false};
  sheet('<h3>🤖 हाज़िर AI सहायक</h3><div class="chat" id="chat" style="max-height:46vh"></div><div class="chips" id="ai_chips"></div>' +
    '<div class="bz"><input id="ai_in" placeholder="बोलिए या लिखिए…" autocomplete="off"><button class="mic2" id="ai_mic" onclick="aiMic()">🎤</button><button onclick="aiSubmit()">भेजें</button></div>' +
    '<p class="mut" style="font-size:12px;margin-top:10px">यह ऑटो-सहायक है। रेट की अंतिम सहमति कारीगर के बुकिंग स्वीकार करने पर मानी जाएगी।</p>');
  $('#ai_in').addEventListener('keydown', e => { if (e.key === 'Enter') aiSubmit(); });
  const a = S.ai;
  aiRun(async () => {
    await botSay('नमस्ते ' + first + ' 🙏 मैं हाज़िर AI सहायक हूँ। बताइए क्या चाहिए। मैं सही कारीगर ढूँढूँगा, रेट पर मोलभाव करूँगा और बुकिंग भी कर दूँगा।');
    if (S.ai !== a) return;
    setChips(exChips());
  }).then(() => { if (pre && S.ai === a) aiHandle(pre); });
}
function aiSubmit(){
  const inp = $('#ai_in'); if (!inp || !S.ai) return;
  const v = inp.value.trim(); if (!v) return;
  if (S.ai.busy) return toast('एक सेकंड…');
  inp.value = ''; aiHandle(v);
}
function aiMic(){
  if (!S.ai) return;
  S.ai.voice = true;
  listen(t => { if (S.ai && !S.ai.busy) aiHandle(t); else toast('एक सेकंड रुककर बोलिए'); }, $('#ai_mic'));
}

/* ---------- समझना और अगला क़दम ---------- */
function aiHandle(text){
  return aiRun(async a => {
    addBub('me', text); setChips([]);
    if (/^\s*(नहीं|रहने दो|कैंसिल|रद्द|छोड़ो)/.test(nz(text)) && a.stage !== 'price') {
      Object.assign(a, {svc:null, provs:null, p:null, when:'', addr:'', qty:'', bulk:false, budget:0, price:undefined, deal:null, stage:'need', intro:false});
      await botSay('ठीक है, रद्द कर दिया। नया काम बताइए।'); setChips(exChips()); return;
    }
    if (a.stage === 'addr') {
      a.addr = text.trim();
    } else if (a.stage === 'when') {
      a.when = parseWhen(text) || text.trim().slice(0, 40);
    } else if (a.stage === 'qty') {
      a.qty = parseQty(text) || text.trim().slice(0, 40);
    } else {
      const k = detectService(text);
      if (k && k !== a.svc) { a.svc = k; a.provs = null; a.p = null; a.price = undefined; a.deal = null; a.intro = false; }
      const w = parseWhen(text); if (w) a.when = w;
      const q = parseQty(text); if (q) a.qty = q;
      if (isBulk(text)) a.bulk = true;
    }
    const pr = parsePrice(text) || (a.stage === 'price' ? (Number((text.match(/^\s*₹?\s*(\d{2,6})\s*$/) || [])[1]) || 0) : 0);
    if (pr) a.budget = pr;
    if (a.svc && BULK_SVC.indexOf(a.svc) >= 0) a.bulk = true;
    await aiNext(a);
  });
}
function aiIntro(a){
  const p = a.p, s = svc(a.svc), r = ratingOf(p.id);
  const lo = Math.min.apply(null, a.provs.filter(canBargain).map(x => Number(x.pMin)).concat([1e9]));
  const hi = Math.max.apply(null, a.provs.filter(canBargain).map(x => Number(x.pMax)).concat([0]));
  return s.emoji + ' ' + s.name + ' की ज़रूरत समझ गया।\n✅ सबसे अच्छा विकल्प: ' + p.name + ' (' + p.area + ')' +
    (p.verified === true ? ' ✔ जाँचा हुआ' : '') + (r ? ' ★' + r.avg.toFixed(1) : '') + '\nरेट: ' + p.rate +
    (lo < 1e9 ? '\nइस काम का आम दायरा: ₹' + lo + ' से ₹' + hi : '') +
    (a.provs.length > 1 ? '\n(' + (a.provs.length - 1) + ' और विकल्प भी हैं)' : '');
}
async function loadProvs(a){
  const res = await Promise.all([
    db.collection('providers').where('service', '==', a.svc).where('active', '==', true).get(),
    db.collection('reviews').where('service', '==', a.svc).get().catch(() => null)
  ]);
  const rate = {};
  if (res[1]) res[1].docs.forEach(d => { const r = d.data(); const e = rate[r.providerId] || (rate[r.providerId] = {sum:0, n:0}); e.sum += Number(r.rating) || 0; e.n += 1; });
  const docs = res[0].docs.map(d => Object.assign({id:d.id}, d.data()));
  docs.forEach(d => { S.cache[d.id] = d; if (rate[d.id]) S.rate[d.id] = rate[d.id]; });
  const score = p => (p.verified === true ? 10 : 0) + (rate[p.id] ? rate[p.id].sum / rate[p.id].n : 0) + (canBargain(p) ? 1 : 0);
  docs.sort((x, y) => (score(y) - score(x)) || (ms(y.createdAt) - ms(x.createdAt)));
  a.provs = docs;
}
function aiOther(){
  return aiRun(async a => {
    const i = (a.provs.indexOf(a.p) + 1) % a.provs.length;
    a.p = a.provs[i]; a.price = undefined; a.deal = null; a.intro = false;
    await aiNext(a);
  });
}
async function aiNext(a){
  if (!a.svc) {
    a.stage = 'need';
    await botSay('बताइए, कौन-सा काम करवाना है? जैसे: "नल टपक रहा है" या "कल सुबह नाई चाहिए"।');
    setChips(exChips()); return;
  }
  if (!a.provs) {
    try { await loadProvs(a); } catch (e) { await botSay('इंटरनेट की दिक्कत है, डेटा नहीं आया। थोड़ी देर बाद कोशिश करें।'); return; }
    if (S.ai !== a) return;
  }
  if (!a.provs.length) {
    const s = svc(a.svc); a.svc = null; a.provs = null; a.stage = 'need';
    await botSay(s.emoji + ' ' + s.name + ' में अभी कोई प्रोवाइडर जुड़ा नहीं है। कोई और काम बताइए।');
    setChips(exChips()); return;
  }
  if (!a.p) a.p = a.provs[0];
  if (!a.intro) { a.intro = true; await botSay(aiIntro(a)); if (S.ai !== a) return; }
  const other = a.provs.length > 1 ? [{t:'🔄 दूसरा प्रोवाइडर', fn:() => aiOther()}] : [];

  if (!a.when) {
    a.stage = 'when';
    await botSay('कब चाहिए? जैसे: कल सुबह 10 बजे');
    setChips(['आज शाम', 'कल सुबह', 'कल शाम'].map(t => ({t:t, fn:() => aiHandle(t)})).concat(other)); return;
  }
  if (!a.addr) {
    a.stage = 'addr';
    await botSay('आपका पता / मोहल्ला क्या है?');
    const last = lsGet('ls_addr');
    setChips((last ? [{t:'📍 ' + last.slice(0, 28), fn:() => aiHandle(last)}] : []).concat(other)); return;
  }
  if (a.bulk && !a.qty) {
    a.stage = 'qty';
    await botSay('कितनी मात्रा चाहिए? जैसे: 100 लीटर, 300 मेहमान, 5 कमरे');
    setChips(other); return;
  }
  if (canBargain(a.p) && a.price === undefined) {
    if (a.budget) { await aiBargain(a); return; }
    a.stage = 'price';
    await botSay('रेट ₹' + a.p.pMax + ' है, पर बात बन सकती है। आप कितना देना चाहेंगे? भाव बोलिए, या मैं आपकी तरफ़ से मोलभाव कर दूँ।');
    setChips([{t:'🤖 AI मोलभाव करे', fn:() => aiRun(x => aiBargain(x))}, {t:'👍 रेट ठीक है', fn:() => aiRun(async x => { x.price = Number(x.p.pMax); addBub('me', 'रेट ठीक है'); await aiNext(x); })}]);
    return;
  }
  if (a.price === undefined) a.price = null;
  a.stage = 'confirm';
  const p = a.p, s = svc(a.svc);
  await botSay('📋 बुकिंग तैयार:\n• काम: ' + s.name + '\n• प्रोवाइडर: ' + p.name + '\n• कब: ' + a.when + '\n• पता: ' + a.addr +
    (a.qty ? '\n• मात्रा: ' + a.qty : '') + (a.price ? '\n• रेट: ₹' + a.price + (a.deal ? ' (मोलभाव से)' : '') : '') + '\n\nपक्का करूँ?');
  setChips([{t:'✅ हाँ, बुक करो', fn:() => aiRun(x => aiConfirm(x))},
    {t:'✏️ बदलें', fn:() => aiRun(async x => { x.when = ''; x.addr = ''; x.price = undefined; x.deal = null; x.stage = 'need'; addBub('me', 'बदलना है'); await aiNext(x); })}].concat(other));
}

/* ---------- AI मोलभाव (ग्राहक की तरफ़ से, प्रोवाइडर की तय सीमा के भीतर) ---------- */
async function aiBargain(a){
  const p = a.p, mn = Number(p.pMin), mx = Number(p.pMax);
  const goal = a.budget || up5(mn * 1.1);
  let offer = Math.max(mn, a.budget ? Math.min(a.budget, mx) : mn), first = null, deal = null, round = 0;
  if (a.budget && a.budget < mn) await botSay('₹' + a.budget + ' इस काम के सबसे कम रेट से नीचे है। मैं सबसे कम संभव भाव से शुरू करता हूँ।');
  await botSay('ठीक है, मैं आपकी तरफ़ से ' + p.name + ' के सहायक से बात करता हूँ। 🤝');
  while (round < 3) {
    if (S.ai !== a) return;
    round += 1; if (first === null) first = offer;
    addBub('me', '🤖 मेरी तरफ़ से: ₹' + offer);
    await sleep(400);
    const r = bargainReply(p, offer, round);
    if (r.deal) { deal = r.price; await botSay('सौदा पक्का: ₹' + deal + ' 🎉', 'deal'); break; }
    await botSay(p.name + ' का सहायक: ₹' + r.counter + ' में कर देंगे।');
    if (r.counter <= goal || r.final) {
      deal = r.counter; addBub('me', '🤖 ₹' + deal + ' मंज़ूर');
      await botSay('सौदा पक्का: ₹' + deal + ' 🎉', 'deal'); break;
    }
    offer = Math.min(mx, Math.max(offer, up5(mn + (r.counter - mn) * 0.3)));
  }
  a.price = deal; a.deal = {price:deal, rounds:round, first:first};
  await aiNext(a);
}

/* ---------- बुकिंग पक्की ---------- */
async function aiConfirm(a){
  const p = a.p, deal = a.deal, offer = a.price || null;
  addBub('me', 'हाँ, बुक करो'); setChips([]);
  try {
    await db.collection('bookings').add({
      customerId:S.uid, customerName:S.profile.name, customerPhone:S.profile.phone,
      providerId:p.id, providerName:p.name, providerPhone:p.phone, service:p.service,
      address:a.addr, when:a.when, note:'🤖 हाज़िर AI सहायक से बुक', bulk:!!a.bulk, qty:a.bulk ? a.qty : '', offer:offer, status:'नया',
      bargained:!!deal, bargainRounds:deal ? deal.rounds : 0, firstOffer:deal ? deal.first : null,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch (e) {
    await botSay('बुकिंग नहीं हो पाई। इंटरनेट देखकर दोबारा कोशिश करें।');
    setChips([{t:'🔁 दोबारा कोशिश', fn:() => aiRun(x => aiConfirm(x))}]); return;
  }
  lsSet('ls_addr', a.addr);
  const msg = 'नमस्ते ' + p.name + ', मैंने हाज़िर ऐप पर बुकिंग की है।\nकाम: ' + svc(p.service).name + (a.bulk && a.qty ? ' (' + a.qty + ')' : '') +
    '\nकब: ' + a.when + '\nपता: ' + a.addr + (offer ? '\n' + (deal ? 'मोलभाव से तय रेट: ₹' : 'रेट: ₹') + offer : '') +
    '\nकृपया ऐप में देखकर स्वीकार करें। - ' + S.profile.name;
  a.stage = 'done';
  await botSay('✅ बुकिंग भेज दी। ' + p.name + ' स्वीकार करेंगे तो आपको "मेरी बुकिंग" में दिखेगा। WhatsApp पर भी बता दें, जवाब जल्दी मिलेगा।');
  setChips([{t:'💬 WhatsApp पर बताएँ', fn:() => window.open('https://wa.me/91' + p.phone + '?text=' + encodeURIComponent(msg), '_blank', 'noopener')},
    {t:'🧾 मेरी बुकिंग', fn:() => { closeSheet(); goBookings(); }}]);
}

  });
}
render();
