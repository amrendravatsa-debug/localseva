<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b7a55">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>लोकल सेवा</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--g1:#0b7a55;--g2:#18b47b;--ink:#10231a;--mut:#5d7267;--bg:#f3f7f5;--line:#e3ece7;--bad:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(84px + env(safe-area-inset-bottom));font-size:15px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;min-height:100vh}
button{font:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
.mut{color:var(--mut)}

/* hero */
.hero{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:calc(env(safe-area-inset-top) + 22px) 20px 60px;border-radius:0 0 34px 34px;position:relative}
.hero.small{padding-bottom:44px}
.hero .hello{opacity:.9;font-size:14px}
.hero h1{font-size:25px;line-height:1.3;margin:6px 0 18px;font-weight:700}
.hero p{opacity:.9;margin-top:4px}
.search{display:flex;gap:10px;align-items:center;background:#fff;border-radius:18px;padding:13px 16px;color:var(--ink);box-shadow:0 10px 26px rgba(0,0,0,.14)}
.search input{border:0;outline:0;flex:1;font:inherit;background:transparent;min-width:0;width:auto;margin:0;padding:0;border-radius:0}
.rf{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 18px);background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:12px;width:40px;height:40px;font-size:20px}

.pad{padding:16px}
.pad.up{margin-top:-32px;position:relative;z-index:1}

/* services grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.svc{border:0;border-radius:24px;padding:20px 12px 16px;color:var(--ink);text-align:center;box-shadow:0 6px 18px rgba(16,35,26,.08);transition:transform .15s}
.svc:active{transform:scale(.96)}
.svc .em{font-size:40px;line-height:1.1;margin-bottom:8px}
.svc b{display:block;font-size:16px}
.svc small{display:block;color:var(--mut);margin-top:2px;font-size:12px}

.promo{display:flex;gap:14px;align-items:center;margin-top:18px;background:#102a20;color:#fff;border-radius:22px;padding:18px}
.promo .pe{font-size:34px}
.promo p{opacity:.8;font-size:13px;margin-top:2px}
.cta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;background:#fff;border:1.5px dashed var(--g2);border-radius:22px;padding:16px 18px;cursor:pointer}
.cta p{color:var(--mut);font-size:13px}
.cta span{font-size:22px;color:var(--g1)}
.install{display:flex;justify-content:space-between;align-items:center;background:#e9f8f1;border-radius:18px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.install button{border:0;background:var(--g1);color:#fff;border-radius:12px;padding:8px 14px;font-weight:700}

/* topbar + detail */
.topbar{position:sticky;top:0;z-index:5;background:rgba(243,247,245,.92);backdrop-filter:blur(8px);display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px}
.topbar h2{font-size:19px}
.back{width:42px;height:42px;border-radius:14px;border:0;background:#fff;box-shadow:0 3px 10px rgba(16,35,26,.1);font-size:20px}
.dh{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;text-align:center;padding:calc(env(safe-area-inset-top) + 16px) 20px 54px;border-radius:0 0 34px 34px;position:relative}
.dh .back{position:absolute;left:16px;top:calc(env(safe-area-inset-top) + 14px);background:rgba(255,255,255,.22);color:#fff;box-shadow:none}
.dh .big{width:92px;height:92px;border-radius:30px;background:#fff;margin:14px auto 12px;display:flex;align-items:center;justify-content:center;font-size:48px;box-shadow:0 10px 24px rgba(0,0,0,.18)}
.dh h2{font-size:22px}
.dh p{opacity:.92;margin-top:4px}
.info{background:#fff;border-radius:20px;padding:14px 16px;margin-bottom:12px;box-shadow:0 4px 14px rgba(16,35,26,.06)}
.info small{color:var(--mut);display:block}
.info b{font-size:18px;color:var(--g1)}

/* cards */
.pc{display:flex;align-items:center;gap:14px;background:#fff;border-radius:22px;padding:14px;margin-bottom:12px;box-shadow:0 6px 18px rgba(16,35,26,.07);cursor:pointer}
.pc:active{transform:scale(.99)}
.av{width:58px;height:58px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.pi{flex:1;min-width:0;display:flex;flex-direction:column}
.pi b{font-size:16px}
.pi span{color:var(--mut);font-size:13px}
.pi .rate{color:var(--g1);font-weight:700;margin-top:2px}
.chev{font-size:26px;color:#9db0a6}
.bc{background:#fff;border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 6px 18px rgba(16,35,26,.07)}
.bc .r1{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.bc .r1 b{font-size:16px}
.bc div.l{color:var(--mut);font-size:14px}
.bc .t{font-size:12px;color:#8aa095;margin-top:6px}
.badge{font-size:12px;font-weight:700;border-radius:99px;padding:4px 12px;white-space:nowrap}
.b-new{background:#fff1cf;color:#8a5a00}.b-ok{background:#dcecff;color:#14509b}.b-done{background:#d9f6e8;color:#0a6b46}.b-no{background:#fde2e2;color:#9b1c1c}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.mini{border:0;border-radius:12px;padding:9px 14px;font-weight:700;font-size:13px;background:var(--g1);color:#fff;text-decoration:none;display:inline-block}
.mini.o{background:#fff;color:var(--g1);border:1.5px solid var(--line)}
.mini.r{background:#fff;color:var(--bad);border:1.5px solid #f5c6c6}
h3.sec{font-size:17px;margin:20px 0 10px}
.empty{text-align:center;padding:40px 20px;color:var(--mut)}
.empty .e{font-size:54px;margin-bottom:8px}

/* buttons + inputs */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:18px;padding:15px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 10px 22px rgba(11,122,85,.28);margin-top:12px;text-decoration:none;font-size:15px}
.btn.wa{background:#25d366;box-shadow:0 10px 22px rgba(37,211,102,.28)}
.btn.ghost{background:#fff;color:var(--g1);box-shadow:none;border:1.5px solid var(--line)}
.btn.dark{background:#102a20;box-shadow:0 10px 22px rgba(16,42,32,.25)}
label{display:block;font-weight:500;font-size:14px;margin-top:4px}
input,textarea,select{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);font:inherit;background:#fff;margin:6px 0 12px;outline:0;color:var(--ink)}
input:focus,textarea:focus,select:focus{border-color:var(--g2)}
.card{background:#fff;border-radius:24px;padding:20px;box-shadow:0 10px 28px rgba(16,35,26,.08)}

/* onboarding */
.ob{padding:calc(env(safe-area-inset-top) + 40px) 22px 30px;text-align:center}
.ob .logo{width:92px;height:92px;border-radius:30px;margin:0 auto 14px;background:linear-gradient(135deg,var(--g1),var(--g2));display:flex;align-items:center;justify-content:center;font-size:48px;box-shadow:0 14px 30px rgba(11,122,85,.35)}
.ob h1{font-size:28px}
.ob p{color:var(--mut);margin:6px 0 26px}
.ob .card{text-align:left}
.ob small{display:block;color:var(--mut);margin-top:16px}

/* switch */
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sw input{display:none}
.sw .tg{width:52px;height:30px;border-radius:99px;background:#ccd8d1;position:relative;transition:.2s;flex:none}
.sw .tg::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.sw input:checked+.tg{background:var(--g2)}
.sw input:checked+.tg::after{left:25px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#fff;display:flex;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;box-shadow:0 -8px 28px rgba(16,35,26,.1);z-index:10}
.nav button{flex:1;border:0;background:transparent;border-radius:16px;padding:8px 4px;color:var(--mut);font-size:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button span{font-size:22px;line-height:1.1}
.nav button.on{background:#e7f6ef;color:var(--g1);font-weight:700}

/* sheet / toast */
#bg{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:.25s;z-index:20}
#bg.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#fff;border-radius:28px 28px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s;z-index:30;max-height:90vh;overflow:auto}
#sheet.on{transform:none}
#sheet h3{font-size:19px;margin-bottom:10px}
#toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px);background:#10231a;color:#fff;padding:12px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:88vw;text-align:center;font-size:14px}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* skeleton */
.sk{height:84px;border-radius:22px;margin-bottom:12px;background:linear-gradient(90deg,#e6eee9 25%,#f3f8f5 50%,#e6eee9 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;color:var(--mut);gap:10px;text-align:center;padding:24px}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid #d5e4dc;border-top-color:var(--g1);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
code{background:#eef3f0;padding:2px 6px;border-radius:6px;font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<div id="bg" onclick="closeSheet()"></div>
<div id="sheet"></div>
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ============ 1) अपना Firebase कॉन्फ़िग यहाँ चिपकाएँ ============ */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT",
  appId: "YOUR_APP_ID"
};
/* ================================================================ */

const CONFIGURED = !!firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf('YOUR_') !== 0;

const SERVICES = [
  {key:'barber', name:'नाई (घर पर)', emoji:'💈', bg:'#fde8ef', hint:'कटिंग, दाढ़ी, मसाज'},
  {key:'plumber', name:'प्लंबर', emoji:'🔧', bg:'#e3f0ff', hint:'नल, पाइप, टंकी'},
  {key:'electrician', name:'इलेक्ट्रीशियन', emoji:'💡', bg:'#fff4d6', hint:'वायरिंग, पंखा, मरम्मत'},
  {key:'laundry', name:'लॉन्ड्री', emoji:'🧺', bg:'#e2f6ee', hint:'धुलाई, प्रेस, पिकअप'},
  {key:'dairy', name:'बल्क दूध-दही', emoji:'🥛', bg:'#eaecff', hint:'शादी-ब्याह के लिए थोक'}
];
const SC = {'नया':'b-new','स्वीकार':'b-ok','पूरा':'b-done','रद्द':'b-no'};

const $ = s => document.querySelector(s);
const svc = k => SERVICES.find(s => s.key === k) || SERVICES[0];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ms = ts => (ts && ts.toMillis) ? ts.toMillis() : 0;
const fmt = ts => {
  if (!ts || !ts.toDate) return '';
  try { return ts.toDate().toLocaleString('hi-IN', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}); }
  catch (e) { return ''; }
};
function loadProfile(){ try { return JSON.parse(localStorage.getItem('ls_profile') || 'null'); } catch (e) { return null; } }
function saveProfile(p){ try { localStorage.setItem('ls_profile', JSON.stringify(p)); } catch (e) {} S.profile = p; }

const S = {tab:'home', view:null, uid:null, profile:loadProfile(), cache:{}, installEv:null};
let auth = null, db = null;

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}
function sheet(html){ $('#sheet').innerHTML = html; $('#sheet').classList.add('on'); $('#bg').classList.add('on'); }
function closeSheet(){ $('#sheet').classList.remove('on'); $('#bg').classList.remove('on'); }

/* ---------- नेविगेशन ---------- */
function setTab(t){ S.tab = t; S.view = null; render(); window.scrollTo(0, 0); }
function go(view, params){ S.view = {view, params}; history.pushState({v:1}, ''); render(); window.scrollTo(0, 0); }
function back(){ history.back(); }
window.addEventListener('popstate', () => { S.view = null; closeSheet(); render(); });

function shell(inner, withNav){
  $('#app').innerHTML = '<div class="wrap">' + inner + '</div>' + (withNav === false ? '' : navHTML());
}
function navHTML(){
  const items = [['home','🏠','सेवाएँ'],['bookings','🧾','मेरी बुकिंग'],['pro','🧑‍🔧','प्रोवाइडर']];
  return '<nav class="nav">' + items.map(i =>
    '<button class="' + (S.tab === i[0] ? 'on' : '') + '" onclick="setTab(\'' + i[0] + '\')"><span>' + i[1] + '</span>' + i[2] + '</button>'
  ).join('') + '</nav>';
}
const skeleton = n => Array.from({length:n}, () => '<div class="sk"></div>').join('');
const emptyHTML = (e, t) => '<div class="empty"><div class="e">' + e + '</div>' + t + '</div>';
const errHTML = () => emptyHTML('⚠️', 'डेटा लोड नहीं हो पाया।<br>इंटरनेट देखें और दोबारा कोशिश करें।<br><button class="btn ghost" onclick="render()">दोबारा कोशिश करें</button>');

/* ---------- मुख्य रेंडर ---------- */
function render(){
  if (!CONFIGURED) return setupScreen();
  if (!S.profile) return onboardScreen();
  if (!S.uid) { $('#app').innerHTML = '<div class="center"><div class="spin"></div>जुड़ रहे हैं…</div>'; return; }
  if (S.view) {
    if (S.view.view === 'list') return viewList(S.view.params);
    if (S.view.view === 'detail') return viewDetail(S.view.params);
  }
  closeSheet();
  if (S.tab === 'home') return viewHome();
  if (S.tab === 'bookings') return viewBookings();
  return viewPro();
}

function setupScreen(){
  $('#app').innerHTML = '<div class="wrap"><div class="ob"><div class="logo">🛠️</div><h1>सेटअप बाकी है</h1><p>Firebase की जानकारी अभी डाली नहीं गई।</p><div class="card"><p>गाइड के अनुसार Firebase का कॉन्फ़िग <code>index.html</code> में <code>firebaseConfig</code> की जगह चिपकाएँ।</p></div></div></div>';
}

/* ---------- ऑनबोर्डिंग ---------- */
function onboardScreen(){
  $('#app').innerHTML = '<div class="wrap"><div class="ob"><div class="logo">🤝</div><h1>लोकल सेवा</h1><p>आपके शहर की हर ज़रूरत, एक ही ऐप में</p>' +
    '<div class="card"><label>आपका नाम</label><input id="o_name" placeholder="जैसे: रमेश कुमार" autocomplete="name">' +
    '<label>मोबाइल नंबर</label><input id="o_phone" type="tel" inputmode="numeric" maxlength="10" placeholder="10 अंकों का नंबर" autocomplete="tel">' +
    '<button class="btn" onclick="doOnboard()">शुरू करें →</button></div>' +
    '<small>आपका नंबर सिर्फ़ बुकिंग के समय सेवा-प्रदाता को दिखेगा।</small></div></div>';
}
function doOnboard(){
  const name = $('#o_name').value.trim(), phone = $('#o_phone').value.trim();
  if (!name) return toast('अपना नाम लिखें');
  if (!/^[6-9]\d{9}$/.test(phone)) return toast('सही 10 अंकों का मोबाइल नंबर डालें');
  saveProfile({name, phone});
  render();
}

/* ---------- होम ---------- */
function svcCards(list){
  return list.length ? list.map(s =>
    '<button class="svc" style="background:' + s.bg + '" onclick="go(\'list\',\'' + s.key + '\')"><div class="em">' + s.emoji + '</div><b>' + s.name + '</b><small>' + s.hint + '</small></button>'
  ).join('') : '<p class="mut">कोई सेवा नहीं मिली</p>';
}
function filterSvc(v){
  v = v.trim();
  $('#svcs').innerHTML = svcCards(SERVICES.filter(s => s.name.indexOf(v) > -1 || s.hint.indexOf(v) > -1));
}
function installApp(){
  const ev = S.installEv; if (!ev) return;
  ev.prompt(); ev.userChoice.then(() => { S.installEv = null; render(); });
}
function viewHome(){
  const first = esc((S.profile.name || '').split(' ')[0]);
  shell(
    '<header class="hero"><div class="hello">नमस्ते, ' + first + ' 👋</div><h1>आज कौन-सा काम<br>करवाना है?</h1>' +
    '<div class="search"><span>🔍</span><input id="q" placeholder="सेवा खोजें…" oninput="filterSvc(this.value)"></div></header>' +
    '<section class="pad up">' +
    (S.installEv ? '<div class="install"><span>📲 इसे फ़ोन की होम स्क्रीन पर जोड़ें</span><button onclick="installApp()">इंस्टॉल</button></div>' : '') +
    '<div id="svcs" class="grid">' + svcCards(SERVICES) + '</div>' +
    '<div class="promo"><div class="pe">🎥</div><div><b>वीडियो कॉल पर रेट तय करें</b><p>घर बैठे दुकानदार को देखें और मोलभाव करें।</p></div></div>' +
    '<div class="cta" onclick="setTab(\'pro\')"><div><b>आप सेवा देते हैं?</b><p>मुफ़्त रजिस्टर करें और नए ग्राहक पाएँ</p></div><span>→</span></div>' +
    '</section>'
  );
}

/* ---------- प्रोवाइडर लिस्ट ---------- */
function pcard(p){
  const s = svc(p.service);
  return '<article class="pc" onclick="go(\'detail\',\'' + esc(p.id) + '\')"><div class="av" style="background:' + s.bg + '">' + s.emoji + '</div>' +
    '<div class="pi"><b>' + esc(p.name) + '</b><span>📍 ' + esc(p.area) + '</span><span class="rate">' + esc(p.rate) + '</span></div><span class="chev">›</span></article>';
}
async function viewList(key){
  const s = svc(key);
  shell('<div class="topbar"><button class="back" onclick="back()">←</button><h2>' + s.emoji + ' ' + s.name + '</h2></div><section class="pad" id="content">' + skeleton(3) + '</section>', false);
  try {
    const snap = await db.collection('providers').where('service', '==', key).where('active', '==', true).get();
    const docs = snap.docs.map(d => Object.assign({id:d.id}, d.data()));
    docs.forEach(d => { S.cache[d.id] = d; });
    docs.sort((a, b) => ms(b.createdAt) - ms(a.createdAt));
    if (!(S.view && S.view.view === 'list' && S.view.params === key)) return;
    $('#content').innerHTML = docs.length ? docs.map(pcard).join('') :
      emptyHTML(s.emoji, 'अभी इस सेवा में कोई प्रोवाइडर नहीं है।<br>आप पहले बनें! <b>प्रोवाइडर</b> टैब में रजिस्टर करें।');
  } catch (e) {
    if ($('#content')) $('#content').innerHTML = errHTML();
  }
}

/* ---------- प्रोवाइडर विवरण ---------- */
function viewDetail(id){
  const p = S.cache[id];
  if (!p) { S.view = null; return render(); }
  const s = svc(p.service), ph = esc(p.phone);
  shell(
    '<div class="dh"><button class="back" onclick="back()">←</button><div class="big">' + s.emoji + '</div><h2>' + esc(p.name) + '</h2><p>' + s.name + ' • 📍 ' + esc(p.area) + '</p></div>' +
    '<section class="pad up">' +
    '<div class="info"><small>रेट</small><b>' + esc(p.rate) + '</b></div>' +
    (p.about ? '<div class="info"><small>जानकारी</small><p>' + esc(p.about) + '</p></div>' : '') +
    '<button class="btn" onclick="startVideo(\'' + esc(id) + '\')">🎥 वीडियो कॉल पर रेट तय करें</button>' +
    '<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/91' + ph + '">💬 WhatsApp पर बात करें</a>' +
    '<a class="btn ghost" href="tel:+91' + ph + '">📞 सीधा कॉल करें</a>' +
    '<button class="btn dark" onclick="bookSheet(\'' + esc(id) + '\')">📅 बुकिंग करें</button>' +
    '</section>', false
  );
}
function startVideo(id){
  const room = 'localseva-' + id + '-' + S.uid;
  db.collection('videoRequests').doc(id + '_' + S.uid).set({
    providerId:id, customerId:S.uid, customerName:S.profile.name, customerPhone:S.profile.phone,
    room:room, createdAt:firebase.firestore.FieldValue.serverTimestamp()
  }).catch(() => {});
  window.open('https://meet.jit.si/' + room, '_blank', 'noopener');
  toast('वीडियो कॉल खुल रही है…');
}
function bookSheet(id){
  const p = S.cache[id]; if (!p) return;
  sheet('<h3>📅 बुकिंग: ' + esc(p.name) + '</h3>' +
    '<label>पता</label><textarea id="b_addr" rows="2" placeholder="मोहल्ला, लैंडमार्क…"></textarea>' +
    '<label>कब चाहिए?</label><input id="b_when" placeholder="जैसे: कल सुबह 10 बजे">' +
    '<label>काम की जानकारी / तय रेट (वैकल्पिक)</label><textarea id="b_note" rows="2"></textarea>' +
    '<button class="btn" id="b_go" onclick="sendBooking(\'' + esc(id) + '\')">बुकिंग भेजें</button>');
}
async function sendBooking(id){
  const p = S.cache[id];
  const address = $('#b_addr').value.trim(), when = $('#b_when').value.trim(), note = $('#b_note').value.trim();
  if (!address || !when) return toast('पता और समय ज़रूर भरें');
  $('#b_go').disabled = true;
  try {
    await db.collection('bookings').add({
      customerId:S.uid, customerName:S.profile.name, customerPhone:S.profile.phone,
      providerId:id, providerName:p.name, providerPhone:p.phone, service:p.service,
      address:address, when:when, note:note, status:'नया',
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    closeSheet(); toast('बुकिंग भेज दी गई ✅');
    S.view = null; S.tab = 'bookings'; render();
  } catch (e) {
    $('#b_go').disabled = false; toast('बुकिंग नहीं हो पाई, दोबारा कोशिश करें');
  }
}

/* ---------- मेरी बुकिंग ---------- */
function bookingCard(b, pro){
  const s = svc(b.service);
  const who = pro ? (b.customerName || 'ग्राहक') : b.providerName;
  const ph = esc(pro ? b.customerPhone : b.providerPhone);
  let acts = '';
  if (ph) acts += '<a class="mini o" href="tel:' + (pro ? '' : '+91') + ph + '">📞 कॉल</a>';
  if (pro && b.status === 'नया') acts += '<button class="mini" onclick="setStatus(\'' + esc(b.id) + '\',\'स्वीकार\')">✔ स्वीकार</button><button class="mini r" onclick="setStatus(\'' + esc(b.id) + '\',\'रद्द\')">रद्द</button>';
  if (pro && b.status === 'स्वीकार') acts += '<button class="mini" onclick="setStatus(\'' + esc(b.id) + '\',\'पूरा\')">✅ काम पूरा हुआ</button>';
  return '<div class="bc"><div class="r1"><b>' + s.emoji + ' ' + esc(who) + '</b><span class="badge ' + (SC[b.status] || 'b-new') + '">' + esc(b.status) + '</span></div>' +
    '<div class="l">🗓 ' + esc(b.when) + '</div><div class="l">📍 ' + esc(b.address) + '</div>' +
    (b.note ? '<div class="l">📝 ' + esc(b.note) + '</div>' : '') +
    '<div class="t">' + fmt(b.createdAt) + '</div>' + (acts ? '<div class="acts">' + acts + '</div>' : '') + '</div>';
}
async function viewBookings(){
  shell('<header class="hero small"><h1>मेरी बुकिंग</h1><p>आपके सभी ऑर्डर यहाँ दिखेंगे</p><button class="rf" onclick="render()">↻</button></header><section class="pad up" id="content">' + skeleton(2) + '</section>');
  try {
    const snap = await db.collection('bookings').where('customerId', '==', S.uid).get();
    const list = snap.docs.map(d => Object.assign({id:d.id}, d.data())).sort((a, b) => ms(b.createdAt) - ms(a.createdAt));
    if (S.tab !== 'bookings' || S.view) return;
    $('#content').innerHTML = list.length ? list.map(b => bookingCard(b, false)).join('') :
      emptyHTML('🧾', 'अभी कोई बुकिंग नहीं है।<br>किसी सेवा में जाकर पहली बुकिंग करें।');
  } catch (e) {
    if ($('#content')) $('#content').innerHTML = errHTML();
  }
}

/* ---------- प्रोवाइडर पैनल ---------- */
function proForm(){
  return '<div class="card"><h3 style="margin-bottom:6px">प्रोवाइडर बनें</h3><p class="mut" style="margin-bottom:14px">अपनी सेवा जोड़ें, नए ग्राहक आपको खुद खोजेंगे। अभी बिल्कुल मुफ़्त।</p>' +
    '<label>आपकी सेवा</label><select id="p_service">' + SERVICES.map(s => '<option value="' + s.key + '">' + s.emoji + ' ' + s.name + '</option>').join('') + '</select>' +
    '<label>नाम / दुकान का नाम</label><input id="p_name" value="' + esc(S.profile.name) + '">' +
    '<label>फ़ोन / WhatsApp नंबर</label><input id="p_phone" type="tel" inputmode="numeric" maxlength="10" value="' + esc(S.profile.phone) + '">' +
    '<label>इलाका / मोहल्ला</label><input id="p_area" placeholder="जैसे: गोड्डा बाज़ार">' +
    '<label>रेट</label><input id="p_rate" placeholder="जैसे: ₹100 कटिंग / ₹60 प्रति लीटर">' +
    '<label>अपने बारे में (वैकल्पिक)</label><textarea id="p_about" rows="2" placeholder="अनुभव, समय, खासियत…"></textarea>' +
    '<button class="btn" id="p_go" onclick="saveProvider()">रजिस्टर करें</button></div>';
}
async function saveProvider(){
  const v = id => $(id).value.trim();
  const data = {service:v('#p_service'), name:v('#p_name'), phone:v('#p_phone'), area:v('#p_area'), rate:v('#p_rate'), about:v('#p_about')};
  if (!data.name || !data.area || !data.rate) return toast('नाम, इलाका और रेट ज़रूर भरें');
  if (!/^[6-9]\d{9}$/.test(data.phone)) return toast('सही 10 अंकों का नंबर डालें');
  $('#p_go').disabled = true;
  try {
    data.active = true; data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
    await db.collection('providers').doc(S.uid).set(data);
    toast('रजिस्ट्रेशन हो गया 🎉'); viewPro();
  } catch (e) {
    $('#p_go').disabled = false; toast('सेव नहीं हो पाया, दोबारा कोशिश करें');
  }
}
async function viewPro(){
  shell('<header class="hero small"><h1>प्रोवाइडर पैनल</h1><p>अपने ऑर्डर और वीडियो अनुरोध यहाँ देखें</p><button class="rf" onclick="render()">↻</button></header><section class="pad up" id="content">' + skeleton(2) + '</section>');
  try {
    const me = await db.collection('providers').doc(S.uid).get();
    if (S.tab !== 'pro' || S.view) return;
    if (!me.exists) { $('#content').innerHTML = proForm(); return; }
    const p = me.data();
    const res = await Promise.all([
      db.collection('videoRequests').where('providerId', '==', S.uid).get(),
      db.collection('bookings').where('providerId', '==', S.uid).get()
    ]);
    if (S.tab !== 'pro' || S.view) return;
    const byTime = (a, b) => ms(b.createdAt) - ms(a.createdAt);
    const vids = res[0].docs.map(d => d.data()).sort(byTime).slice(0, 10);
    const bks = res[1].docs.map(d => Object.assign({id:d.id}, d.data())).sort(byTime);
    const s = svc(p.service);
    $('#content').innerHTML =
      '<div class="card"><label class="sw"><span><b>' + s.emoji + ' ' + esc(p.name) + '</b><br><span class="mut" style="font-size:13px">' + (p.active ? 'आप ग्राहकों को दिख रहे हैं' : 'आप अभी छिपे हुए हैं') + '</span></span>' +
      '<input type="checkbox" ' + (p.active ? 'checked' : '') + ' onchange="toggleActive(this.checked)"><span class="tg"></span></label></div>' +
      '<h3 class="sec">🎥 वीडियो बातचीत के अनुरोध</h3>' +
      (vids.length ? vids.map(v => '<div class="bc"><div class="r1"><b>' + esc(v.customerName || 'ग्राहक') + '</b><a class="mini" target="_blank" rel="noopener" href="https://meet.jit.si/' + esc(v.room) + '">जुड़ें</a></div><div class="t">' + fmt(v.createdAt) + '</div></div>').join('') : '<p class="mut">अभी कोई अनुरोध नहीं</p>') +
      '<h3 class="sec">🧾 मेरे ऑर्डर</h3>' +
      (bks.length ? bks.map(b => bookingCard(b, true)).join('') : '<p class="mut">अभी कोई ऑर्डर नहीं</p>');
  } catch (e) {
    if ($('#content')) $('#content').innerHTML = errHTML();
  }
}
function toggleActive(on){
  db.collection('providers').doc(S.uid).update({active:on}).then(() => { toast(on ? 'आप अब दिख रहे हैं' : 'आप छिपा दिए गए'); viewPro(); }).catch(() => toast('बदल नहीं पाया'));
}
function setStatus(id, st){
  db.collection('bookings').doc(id).update({status:st}).then(() => { toast('अपडेट हो गया'); viewPro(); }).catch(() => toast('अपडेट नहीं हो पाया'));
}

/* ---------- शुरुआत ---------- */
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); S.installEv = e;
  if (S.uid && S.profile && !S.view && S.tab === 'home') render();
});
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
if (CONFIGURED) {
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth(); db = firebase.firestore();
  auth.onAuthStateChanged(u => { if (u) { S.uid = u.uid; render(); } });
  auth.signInAnonymously().catch(() => {
    $('#app').innerHTML = '<div class="center"><div style="font-size:48px">⚠️</div>जुड़ नहीं पाए।<br>Firebase में <b>Anonymous</b> साइन-इन चालू है या नहीं देखें।</div>';
  });
}
render();
</script>
</body>
</html>
