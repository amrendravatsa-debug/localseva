<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c2410c">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>हाज़िर</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--g1:#c2410c;--g2:#f97316;--ink:#2a1d14;--mut:#7a6a5e;--bg:#fff8f1;--line:#f0e2d3;--bad:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(84px + env(safe-area-inset-bottom));font-size:15px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;min-height:100vh}
button{font:inherit;cursor:pointer}
h1,h2,h3,p{margin:0}
.mut{color:var(--mut)}

/* hero */
.hero{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:calc(env(safe-area-inset-top) + 22px) 20px 60px;border-radius:0 0 34px 34px;position:relative}
.hero.small{padding-bottom:44px}
.hero .hello{opacity:.9;font-size:14px}
.hero h1{font-size:25px;line-height:1.3;margin:6px 0 18px;font-weight:700}
.hero p{opacity:.9;margin-top:4px}
.search{display:flex;gap:10px;align-items:center;background:#fff;border-radius:18px;padding:13px 16px;color:var(--ink);box-shadow:0 10px 26px rgba(0,0,0,.14)}
.search input{border:0;outline:0;flex:1;font:inherit;background:transparent;min-width:0;width:auto;margin:0;padding:0;border-radius:0}
.rf{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 18px);background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:12px;width:40px;height:40px;font-size:20px}

.brandrow{display:flex;align-items:center;gap:10px;margin-bottom:12px}.brandrow svg{width:34px;height:34px;flex:none}.brandrow b{font-size:20px;letter-spacing:.2px}.brandrow small{display:block;opacity:.9;font-size:12px;margin-top:-2px}
.vach{display:flex;gap:14px;align-items:center;margin-top:12px;background:#fff;border-radius:22px;padding:16px 18px;box-shadow:0 6px 18px rgba(42,29,20,.07);cursor:pointer}.vach .pe{font-size:30px}.vach p{color:var(--mut);font-size:13px}.vach span{margin-left:auto;font-size:22px;color:var(--g1)}
.vl{list-style:none;padding:0;margin:10px 0 4px}.vl li{display:flex;gap:12px;margin:12px 0}.vl .n{flex:none;width:30px;height:30px;border-radius:10px;background:#ffeedd;color:var(--g1);font-weight:700;display:flex;align-items:center;justify-content:center}.vl b{display:block}.vl small{color:var(--mut)}
.pad{padding:16px}
.pad.up{margin-top:-32px;position:relative;z-index:1}

/* services grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.svc{border:0;border-radius:24px;padding:20px 12px 16px;color:var(--ink);text-align:center;box-shadow:0 6px 18px rgba(42,29,20,.08);transition:transform .15s}
.svc:active{transform:scale(.96)}
.svc .em{font-size:40px;line-height:1.1;margin-bottom:8px}
.svc b{display:block;font-size:16px}
.svc small{display:block;color:var(--mut);margin-top:2px;font-size:12px}

.promo{display:flex;gap:14px;align-items:center;margin-top:18px;background:#2b1d14;color:#fff;border-radius:22px;padding:18px}
.promo .pe{font-size:34px}
.promo p{opacity:.8;font-size:13px;margin-top:2px}
.cta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;background:#fff;border:1.5px dashed var(--g2);border-radius:22px;padding:16px 18px;cursor:pointer}
.cta p{color:var(--mut);font-size:13px}
.cta span{font-size:22px;color:var(--g1)}
.install{display:flex;justify-content:space-between;align-items:center;background:#ffeedd;border-radius:18px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.install button{border:0;background:var(--g1);color:#fff;border-radius:12px;padding:8px 14px;font-weight:700}

/* topbar + detail */
.topbar{position:sticky;top:0;z-index:5;background:rgba(255,248,241,.92);backdrop-filter:blur(8px);display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px}
.topbar h2{font-size:19px}
.back{width:42px;height:42px;border-radius:14px;border:0;background:#fff;box-shadow:0 3px 10px rgba(42,29,20,.1);font-size:20px}
.dh{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;text-align:center;padding:calc(env(safe-area-inset-top) + 16px) 20px 54px;border-radius:0 0 34px 34px;position:relative}
.dh .back{position:absolute;left:16px;top:calc(env(safe-area-inset-top) + 14px);background:rgba(255,255,255,.22);color:#fff;box-shadow:none}
.dh .big{width:92px;height:92px;border-radius:30px;background:#fff;margin:14px auto 12px;display:flex;align-items:center;justify-content:center;font-size:48px;box-shadow:0 10px 24px rgba(0,0,0,.18)}
.dh h2{font-size:22px}
.dh p{opacity:.92;margin-top:4px}
.info{background:#fff;border-radius:20px;padding:14px 16px;margin-bottom:12px;box-shadow:0 4px 14px rgba(42,29,20,.06)}
.info small{color:var(--mut);display:block}
.info b{font-size:18px;color:var(--g1)}

/* cards */
.pc{display:flex;align-items:center;gap:14px;background:#fff;border-radius:22px;padding:14px;margin-bottom:12px;box-shadow:0 6px 18px rgba(42,29,20,.07);cursor:pointer}
.pc:active{transform:scale(.99)}
.av{width:58px;height:58px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.pi{flex:1;min-width:0;display:flex;flex-direction:column}
.pi b{font-size:16px}
.pi span{color:var(--mut);font-size:13px}
.pi .rate{color:var(--g1);font-weight:700;margin-top:2px}
.chev{font-size:26px;color:#9db0a6}
.bc{background:#fff;border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:0 6px 18px rgba(42,29,20,.07)}
.bc .r1{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.bc .r1 b{font-size:16px}
.bc div.l{color:var(--mut);font-size:14px}
.bc .t{font-size:12px;color:#a8998c;margin-top:6px}
.badge{font-size:12px;font-weight:700;border-radius:99px;padding:4px 12px;white-space:nowrap}
.b-new{background:#fff1cf;color:#8a5a00}.b-ok{background:#dcecff;color:#14509b}.b-done{background:#d9f6e8;color:#0a6b46}.b-no{background:#fde2e2;color:#9b1c1c}.b-here{background:#ece4ff;color:#5b2fa8}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.mini{border:0;border-radius:12px;padding:9px 14px;font-weight:700;font-size:13px;background:var(--g1);color:#fff;text-decoration:none;display:inline-block}
.mini.o{background:#fff;color:var(--g1);border:1.5px solid var(--line)}
.mini.r{background:#fff;color:var(--bad);border:1.5px solid #f5c6c6}
h3.sec{font-size:17px;margin:20px 0 10px}
.empty{text-align:center;padding:40px 20px;color:var(--mut)}
.empty .e{font-size:54px;margin-bottom:8px}

/* buttons + inputs */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:18px;padding:15px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 10px 22px rgba(194,65,12,.30);margin-top:12px;text-decoration:none;font-size:15px}
.btn.wa{background:#25d366;box-shadow:0 10px 22px rgba(37,211,102,.28)}
.btn.ghost{background:#fff;color:var(--g1);box-shadow:none;border:1.5px solid var(--line)}
.btn.dark{background:#2b1d14;box-shadow:0 10px 22px rgba(43,29,20,.25)}
label{display:block;font-weight:500;font-size:14px;margin-top:4px}
input,textarea,select{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);font:inherit;background:#fff;margin:6px 0 12px;outline:0;color:var(--ink)}
input:focus,textarea:focus,select:focus{border-color:var(--g2)}
.card{background:#fff;border-radius:24px;padding:20px;box-shadow:0 10px 28px rgba(42,29,20,.08)}

/* onboarding */
.ob{padding:calc(env(safe-area-inset-top) + 40px) 22px 30px;text-align:center}
.ob .logo{width:92px;height:92px;border-radius:30px;margin:0 auto 14px;background:linear-gradient(135deg,var(--g1),var(--g2));display:flex;align-items:center;justify-content:center;font-size:48px;box-shadow:0 14px 30px rgba(194,65,12,.38)}
.ob h1{font-size:28px}
.ob p{color:var(--mut);margin:6px 0 26px}
.ob .card{text-align:left}
.ob small{display:block;color:var(--mut);margin-top:16px}

/* switch */
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sw input{display:none}
.sw .tg{width:52px;height:30px;border-radius:99px;background:#ccd8d1;position:relative;transition:.2s;flex:none}
.sw .tg::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.sw input:checked+.tg{background:var(--g2)}
.sw input:checked+.tg::after{left:25px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#fff;display:flex;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));border-radius:24px 24px 0 0;box-shadow:0 -8px 28px rgba(42,29,20,.1);z-index:10}
.nav button{flex:1;border:0;background:transparent;border-radius:16px;padding:8px 4px;color:var(--mut);font-size:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button span{font-size:22px;line-height:1.1}
.nav button.on{background:#ffeedd;color:var(--g1);font-weight:700}

/* sheet / toast */
#bg{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:.25s;z-index:20}
#bg.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#fff;border-radius:28px 28px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s;z-index:30;max-height:90vh;overflow:auto}
#sheet.on{transform:none}
#sheet h3{font-size:19px;margin-bottom:10px}
#toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px);background:#10231a;color:#fff;padding:12px 20px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:88vw;text-align:center;font-size:14px}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* skeleton */
.sk{height:84px;border-radius:22px;margin-bottom:12px;background:linear-gradient(90deg,#e6eee9 25%,#f3f8f5 50%,#e6eee9 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;color:var(--mut);gap:10px;text-align:center;padding:24px}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid #d5e4dc;border-top-color:var(--g1);animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.vb{display:inline-block;background:#e0f5ea;color:#0a6b46;border-radius:99px;padding:1px 8px;font-size:11px;font-weight:700;margin-left:6px;vertical-align:middle}
.rt{color:#b7791f;font-weight:700;font-size:13px}
.chat{display:flex;flex-direction:column;gap:8px;margin:10px 0;max-height:42vh;overflow:auto}
.bub{max-width:88%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.5}
.bub.bot{background:#fff1e3;align-self:flex-start;border-bottom-left-radius:5px}
.bub.me{background:var(--g1);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
.bub.deal{background:#d9f6e8;color:#0a6b46;font-weight:700}
.bz{display:flex;gap:8px;align-items:center}.bz input{margin:0;flex:1}.bz button{flex:none;border:0;border-radius:14px;padding:13px 16px;background:var(--g1);color:#fff;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tag{display:inline-block;background:#fff1cf;color:#8a5a00;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;margin-left:6px}
.chk{display:flex;align-items:center;gap:10px;margin:6px 0 12px;font-weight:500}
.chk input{width:22px;height:22px;margin:0;flex:none}
.stars{display:flex;gap:6px;justify-content:center;margin:10px 0 16px}
.stars button{border:0;background:transparent;font-size:38px;line-height:1;color:#d3dcd7;padding:0}
.stars button.on{color:#f5b301}
.rv{border-top:1px solid var(--line);padding:10px 0;font-size:14px;color:var(--ink);font-weight:400}
code{background:#eef3f0;padding:2px 6px;border-radius:6px;font-size:13px}
/* AI सहायक */
.bub{white-space:pre-line}
.search .mic{flex:none;border:0;background:#ffeedd;border-radius:50%;width:38px;height:38px;font-size:18px;padding:0}
.mic.live,.mic2.live{animation:pulse 1s infinite;background:#fca5a5!important}
.bz .mic2{background:#ffeedd;color:var(--g1);padding:13px 14px}
@keyframes pulse{50%{transform:scale(1.12)}}
.aic{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#2b1d14,#7c2d12);color:#fff;border-radius:22px;padding:16px 18px;margin-bottom:14px;cursor:pointer;box-shadow:0 10px 26px rgba(124,45,18,.35)}
.aic p{opacity:.85;font-size:13px;margin-top:2px}
.aic>span{margin-left:auto;font-size:24px}
.orb{flex:none;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#fdba74 40%,#f97316);box-shadow:0 0 22px rgba(249,115,22,.8);animation:breath 2.4s ease-in-out infinite}
@keyframes breath{50%{transform:scale(1.1);box-shadow:0 0 32px rgba(249,115,22,.95)}}
.nudge{display:flex;gap:12px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:12px 16px;margin-bottom:14px;cursor:pointer}
.nudge .ne{font-size:28px}.nudge small{display:block;color:var(--mut)}.nudge .go{margin-left:auto;color:var(--g1);font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.chip.on{background:var(--g1);color:#fff;border-color:var(--g1)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.row .btn{flex:1;text-align:center;text-decoration:none}
.chip{border:1.5px solid var(--line);background:#fff;color:var(--g1);border-radius:99px;padding:8px 14px;font-weight:700;font-size:13px}
.bub.typing i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--g1);opacity:.35;animation:blink 1s infinite}
.bub.typing i:nth-child(2){animation-delay:.2s}.bub.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.orb,.mic.live,.mic2.live,.bub.typing i{animation:none}}
/* भाषा, जगह, भुगतान */
.lg{position:absolute;top:calc(env(safe-area-inset-top) + 18px);right:16px;height:40px;padding:0 14px;border:0;border-radius:12px;background:rgba(255,255,255,.22);color:#fff;font-weight:700;font-size:13px}
.hero.small .lg{right:64px}
.ob .lg{position:static;height:36px;background:#ffeedd;color:var(--g1)}
.locbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:10px 14px;margin-bottom:12px;font-size:13px}
.locbar.ok{background:#e6f7ef;border-color:#bfe8d3;color:#0a6b46}
.locbar.warn{background:#fff1cf;border-color:#f3dc9a;color:#8a5a00}
.tag.far{background:#fde2e2;color:#9b1c1c}
.mic2.sp{border:0;border-radius:12px;background:#ffeedd;color:var(--g1);padding:6px 10px;font-size:16px;float:right;cursor:pointer}
</style>
</head>

function stars(n){ n = Math.max(0, Math.min(5, Number(n) || 0)); return '★★★★★'.slice(0, n) + '☆☆☆☆☆'.slice(0, 5 - n); }
function ratingOf(pid){ const r = S.rate[pid]; return r && r.n ? {avg:r.sum / r.n, n:r.n} : null; }
function ratingHTML(pid){ const r = ratingOf(pid); return r ? '<span class="rt">★ ' + r.avg.toFixed(1) + ' (' + r.n + ')</span>' : '<span class="mut">नया</span>'; }
function canBargain(p){ return p && p.bargain === true && Number(p.pMin) > 0 && Number(p.pMax) >= Number(p.pMin); }
function up5(x){ return Math.ceil(x / 5) * 5; }
/* नियम-आधारित मोलभाव: तीन दौर; हर दौर की स्वीकार-सीमा घटती है, तीसरे में न्यूनतम */
function bargainReply(p, o, round){
  const mn = Number(p.pMin), mx = Number(p.pMax), R = mx - mn;
  const T = [Math.min(mx, up5(mn + 0.5 * R)), Math.min(mx, up5(mn + 0.25 * R)), mn];
  const thr = T[Math.min(round, 3) - 1];
  if (o >= thr) return {deal:true, price:Math.min(o, mx), final:false};
  const counter = Math.max(mn, thr);
  return {deal:false, counter:counter, final:round >= 3, low:o < mn};
}

function bargainSend(){
  const b = S.bg, p = S.cache[b.id];
  const o = Number(($('#bz_in').value || '').replace(/\D/g, ''));
  if (!o || o < 1) return toast('अपना भाव लिखें');
  b.round += 1; if (b.first === null) b.first = o;
  b.msgs.push({w:'me', t:'₹' + o});
  const r = bargainReply(p, o, b.round);
  if (r.deal) {
    b.done = r.price; b.counter = null;
    b.msgs.push({w:'bot', deal:true, t:'सौदा पक्का! 🎉 ₹' + r.price + ' में काम हो जाएगा।'});
  } else if (r.final) {
    b.counter = r.counter;
    b.msgs.push({w:'bot', t:'₹' + o + ' में नहीं हो पाएगा। मेरा आख़िरी भाव ₹' + r.counter + ' है, इससे नीचे नहीं जा सकते।'});
  } else {
    b.counter = r.counter;
    const lines = b.round === 1 ? ['₹' + o + ' थोड़ा कम है। ₹' + r.counter + ' में कर देते हैं?'] : ['चलिए, थोड़ा और कम करते हैं: ₹' + r.counter + '।'];
    b.msgs.push({w:'bot', t:lines[0]});
  }
  bargainRender();
}

async function sendBooking(id){

const DEV = /[ऀ-ॿ]/;
const TR_KEYS = Object.keys(TR).filter(k => k.length >= 7 || /[ ₹]/.test(k)).sort((a, b) => b.length - a.length);
function trStr(s){
  const t = s.trim(); if (!t) return s;
  if (TR[t] !== undefined) return s.replace(t, TR[t]);
  const core = t.replace(/^[^\u0900-\u097FA-Za-z0-9]+/, '').replace(/[^\u0900-\u097FA-Za-z0-9)…?!.]+$/, '');
  if (core && core !== t && TR[core] !== undefined) return s.replace(core, TR[core]);
  let out = s;
  for (let i = 0; i < TR_KEYS.length; i++) { const k = TR_KEYS[i]; if (out.indexOf(k) > -1) out = out.split(k).join(TR[k]); }
  return out.replace(/।/g, '.');
}
function trNode(n){
  if (S.lang !== 'en') return;
  if (n.nodeType === 3) { const v = n.nodeValue; if (DEV.test(v)) { const r = trStr(v); if (r !== v) n.nodeValue = r; } return; }
  if (n.nodeType !== 1) return;
  ['placeholder', 'aria-label', 'title'].forEach(at => { const v = n.getAttribute(at); if (v && DEV.test(v)) { const r = trStr(v); if (r !== v) n.setAttribute(at, r); } });
  if (n.tagName === 'SCRIPT' || n.tagName === 'STYLE' || n.tagName === 'TEXTAREA') return;
  n.childNodes.forEach(trNode);
}
new MutationObserver(ms => {
  if (S.lang !== 'en') return;
  ms.forEach(m => { if (m.type === 'characterData') trNode(m.target); else m.addedNodes.forEach(trNode); });
}).observe(document.body, {childList:true, subtree:true, characterData:true});

/* ---------- जगह, दूरी और यात्रा-शुल्क ---------- */
const VENUE = ['banquet', 'marriage', 'hotel'];
const MAXKM = {barber:6, maid:5, laundry:8, plumber:12, electrician:12, mistri:15, cleaning:12, appliance:15, beauty:10, pandit:25, tent:30, dairy:25, banquet:0, marriage:0, hotel:0};
function getPos(cb){
  if (!navigator.geolocation) return toast(L('इस फ़ोन में लोकेशन नहीं चलती', 'Location is not available on this device'));
  toast(L('आपकी जगह खोज रहे हैं…', 'Finding your location…'));
  navigator.geolocation.getCurrentPosition(
    p => cb({lat:+p.coords.latitude.toFixed(3), lng:+p.coords.longitude.toFixed(3)}),
    e => toast(e.code === 1 ? L('लोकेशन की अनुमति दें', 'Please allow location access') : L('जगह नहीं मिल पाई, दोबारा कोशिश करें', 'Could not get location, try again')),
    {enableHighAccuracy:true, timeout:12000, maximumAge:60000});
}
function setLoc(){ getPos(p => { S.loc = p; lsSet('ls_loc', JSON.stringify(p)); toast(L('✅ जगह चालू हो गई', '✅ Location is on')); render(); }); }
function clearLoc(){ S.loc = null; try { localStorage.removeItem('ls_loc'); } catch (e) {} render(); }
function locBar(){
  return S.loc
    ? '<div class="locbar ok"><span>📍 ' + L('आपकी जगह चालू है, पास के कारीगर पहले दिखेंगे', 'Location is on: nearest providers first') + '</span><span><button class="mini o" onclick="setLoc()">↻</button> <button class="mini o" onclick="clearLoc()">✕</button></span></div>'
    : '<div class="locbar"><span>📍 ' + L('जगह चालू करें, पास के कारीगर पहले दिखेंगे', 'Turn on location to see nearby providers first') + '</span><button class="mini" onclick="setLoc()">' + L('चालू करें', 'Turn on') + '</button></div>' + areaBar();
}
function distKm(a, b){
  const R = 6371, rad = x => x * Math.PI / 180, dLa = rad(b.lat - a.lat), dLo = rad(b.lng - a.lng);
  const h = Math.pow(Math.sin(dLa / 2), 2) + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.pow(Math.sin(dLo / 2), 2);
  return 2 * R * Math.asin(Math.sqrt(h));
}
/* सीधी दूरी × 1.3 ≈ सड़क की अनुमानित दूरी */
function roadKm(p){ return (S.loc && p && p.lat && p.lng) ? Math.round(distKm(S.loc, p) * 13) / 10 : null; }
function travelFee(p, km){
  if (km == null || VENUE.indexOf(p.service) >= 0) return 0;
  const free = p.freeKm != null ? Number(p.freeKm) : 5, per = Number(p.perKm) || 0;
  return (!per || km <= free) ? 0 : up5((km - free) * per);
}
function areaMatch(p){
  const a = nz(S.area || ''), b = nz(p.area || '');
  return a.length >= 3 && b.length >= 3 && (a.indexOf(b) >= 0 || b.indexOf(a) >= 0);
}
function setArea(){ const v = ($('#ar_in').value || '').trim().slice(0, 60); S.area = v; lsSet('ls_area', v); toast(v ? L('✅ मोहल्ला सेव हो गया', '✅ Area saved') : L('मोहल्ला हटा दिया', 'Area cleared')); render(); }
function areaBar(){
  return '<div class="locbar" style="gap:8px"><input id="ar_in" placeholder="' + L('GPS नहीं? अपना मोहल्ला लिखें', 'No GPS? Type your area') + '" value="' + esc(S.area || '') + '" style="margin:0;flex:1"><button class="mini" onclick="setArea()">' + L('सेव', 'Save') + '</button></div>';
}
function tierOf(p, km){
  if (km == null) return (!S.loc && S.area && areaMatch(p)) ? 0 : 1.5;
  if (VENUE.indexOf(p.service) >= 0) return km <= 10 ? 0 : km <= 30 ? 1 : 2;
  const free = p.freeKm != null ? Number(p.freeKm) : 5, mx = Number(p.maxKm) > 0 ? Number(p.maxKm) : (MAXKM[p.service] || 10);
  return km <= free ? 0 : km <= mx ? 1 : 2;
}
function tripOf(p){ const km = roadKm(p); return {km:km, fee:travelFee(p, km)}; }
/* पहले पास वाले, फिर दूरी का दायरा, फिर रेटिंग */
function rankList(docs){
  docs.forEach(p => { p._km = roadKm(p); p._tier = tierOf(p, p._km); p._fee = travelFee(p, p._km); });
  const score = p => { const r = ratingOf(p.id); return (p.verified === true ? 10 : 0) + (r ? r.avg : 0); };
  const band = p => Math.floor((p._km == null ? 0 : p._km) / 3);
  docs.sort((a, b) => (a._tier - b._tier) || (band(a) - band(b)) || (score(b) - score(a)) || ((a._km || 0) - (b._km || 0)) || (ms(b.createdAt) - ms(a.createdAt)));
}
function nearOnly(docs){
  if (!S.loc || S.showFar || !docs.some(p => p._tier <= 1.5)) return {docs:docs, far:0};
  const keep = docs.filter(p => p._tier <= 1.5);
  return {docs:keep, far:docs.length - keep.length};
}
function farBtn(n){
  return n ? '<div class="locbar"><span>🚗 ' + L(n + ' दूर के प्रोवाइडर छिपे हैं', n + ' far-away providers hidden') + '</span><button class="mini o" onclick="S.showFar = true; render()">' + L('दिखाएँ', 'Show') + '</button></div>' : '';
}
function distHTML(p){
  if (p._km == null) return (!S.loc && S.area && p._tier === 0) ? ' • <span class="tag">📍 ' + L('आपके मोहल्ले में', 'In your area') + '</span>' : '';
  return ' • 🚗 ~' + p._km + ' ' + L('किमी', 'km') +
    (p._tier === 2 ? '<span class="tag far">' + L('दूर से', 'From afar') + '</span>' : '') +
    (p._fee > 0 ? '<span class="tag">+₹' + p._fee + ' ' + L('यात्रा', 'travel') + '</span>' : '');
}
function nearBanner(docs){
  if (!S.loc || !docs.length) return '';
  const near = docs.filter(p => p._tier <= 1.5);
  return near.length ? '' : '<div class="locbar warn">⚠️ ' + L('आपके पास कोई नहीं मिला। ये दूर से आएँगे, यात्रा-शुल्क लग सकता है।', 'No one nearby. These providers would travel from afar and may charge for travel.') + '</div>';
}
function tripInfoHTML(p){
  const km = roadKm(p); if (km == null) return '';
  const fee = travelFee(p, km), venue = VENUE.indexOf(p.service) >= 0;
  return '<div class="info"><small>🚗 ' + L('दूरी (अनुमानित)', 'Distance (approx.)') + '</small><b>~' + km + ' ' + L('किमी', 'km') + '</b>' +
    (venue ? '' : '<div class="mut" style="font-size:13px">' + (fee ? L('यात्रा-शुल्क: ₹' + fee + ' (' + (p.freeKm != null ? p.freeKm : 5) + ' किमी तक मुफ़्त)', 'Travel charge: ₹' + fee + ' (free up to ' + (p.freeKm != null ? p.freeKm : 5) + ' km)') : L('यात्रा-शुल्क नहीं', 'No travel charge')) + '</div>') + '</div>';
}
function tripLineHTML(p){
  const t = tripOf(p);
  if (t.km == null) return (!S.loc && VENUE.indexOf(p.service) < 0 && !(S.area && areaMatch(p))) ? '<div class="info" style="margin:6px 0 10px"><small>🚗 ' + L('दूरी पता नहीं', 'Distance unknown') + '</small><p>' + L('आपकी जगह पता नहीं, इसलिए दूर से आने पर कारीगर यात्रा-शुल्क माँग सकते हैं। जगह या मोहल्ला सेव करें तो पहले से दिखेगा।', 'Your location is unknown, so a provider coming from afar may ask for a travel charge. Save your location or area to see it upfront.') + '</p></div>' : '';
  return '<div class="info" style="margin:6px 0 10px"><small>🚗 ' + L('दूरी और यात्रा-शुल्क', 'Distance and travel charge') + '</small><b style="font-size:15px">~' + t.km + ' ' + L('किमी', 'km') +
    (VENUE.indexOf(p.service) >= 0 ? '' : ' • ' + (t.fee ? L('यात्रा-शुल्क', 'Travel') + ' ₹' + t.fee : L('यात्रा-शुल्क नहीं', 'No travel charge'))) + '</b></div>';
}

function statusToast(b){
  const n = b.providerName || '';
  const m = b.status === 'स्वीकार' ? L('✅ ' + n + ' ने बुकिंग स्वीकार की', '✅ ' + n + ' accepted your booking')
    : b.status === ST_HERE ? L('🙋 ' + n + ' हाज़िर हो गए', '🙋 ' + n + ' has arrived')

    '<a class="btn" href="' + esc(link) + '">📲 ' + L('UPI ऐप खोलें', 'Open UPI app') + '</a>' +

}

async function finishJob(id){
  const c = ($('#o_code').value || '').replace(/\D/g, ''), amt = Number(($('#o_amt').value || '').replace(/\D/g, ''));
  if (c.length !== 4) return toast(L('4 अंक का कोड डालें', 'Enter the 4-digit code'));

  const com = Math.ceil(amt * Number(cfg().commissionPct) / 100);
  try {
    const dref = db.collection('providerDues').doc(S.uid), bref = db.collection('bookings').doc(id);
    const dd = await dref.get(), b = db.batch();
    b.update(bref, {status:'पूरा', otpCode:c, amount:amt, commission:com});
    if (dd.exists) b.update(dref, {owed:(Number(dd.data().owed) || 0) + com, jobs:(Number(dd.data().jobs) || 0) + 1, lastBooking:id});
    else b.set(dref, {owed:com, paid:0, jobs:1, lastBooking:id, ref:(S.mypro && S.mypro.ref) || '', firstJobAt:firebase.firestore.FieldValue.serverTimestamp()});
    await b.commit(); S.dues = null; loadDues().then(() => { if (S.tab === 'pro' && !S.view) viewPro(); });
    closeSheet(); toast(L('✅ काम पूरा दर्ज हो गया', '✅ Job marked done'));

async function createBooking(data){
  const ref = db.collection('bookings').doc();
  const otp = String(1000 + (crypto.getRandomValues(new Uint32Array(1))[0] % 9000));
  const batch = db.batch();
  batch.set(ref, data);
  batch.set(db.collection('bookingSecrets').doc(ref.id), {customerId:S.uid, otp:otp});
  await batch.commit();
  S.otps[ref.id] = otp;
  return ref.id;
}

    .then(d => { S.otps[b.id] = d.exists ? d.data().otp : null; }).catch(() => { S.otps[b.id] = null; }))).then(done);

async function doDeleteAccount(){
  const btn = $('#d_go'); btn.disabled = true;
  const live = ['नया', 'स्वीकार', ST_HERE];
  try {
    const cb = await db.collection('bookings').where('customerId', '==', S.uid).get();
    const pb = await db.collection('bookings').where('providerId', '==', S.uid).get();
    if (cb.docs.concat(pb.docs).some(d => live.indexOf(d.data().status) >= 0)) { btn.disabled = false; return toast(L('पहले चालू बुकिंग पूरी करें या रद्द करें', 'First finish or cancel your active bookings')); }
    const ops = [];
    cb.docs.forEach(d => { if (d.data().deleted !== true) ops.push(b => b.update(d.ref, {customerName:'हटाया गया', customerPhone:'', address:'हटाया गया', note:'', deleted:true})); ops.push(b => b.delete(db.collection('bookingSecrets').doc(d.id))); });
    const rv = await db.collection('reviews').where('customerId', '==', S.uid).get();
    rv.docs.forEach(d => ops.push(b => b.delete(d.ref)));
    const vr = await db.collection('videoRequests').where('customerId', '==', S.uid).get();
    vr.docs.forEach(d => ops.push(b => b.delete(d.ref)));
    const dd = await db.collection('providerDues').doc(S.uid).get();
    if (dd.exists && (Number(dd.data().owed) || 0) - (Number(dd.data().paid) || 0) > 0) { btn.disabled = false; return toast(L('पहले हाज़िर का बकाया चुकाएँ', 'Please clear Hazir dues first')); }
    const sd = await db.collection('saathis').doc(S.uid).get();
    if (sd.exists) { ops.push(b => b.delete(sd.ref)); if (sd.data().code) ops.push(b => b.delete(db.collection('saathiCodes').doc(sd.data().code))); }
    ops.push(b => b.delete(db.collection('providers_private').doc(S.uid)));
    ops.push(b => b.delete(db.collection('providers').doc(S.uid)));
    for (let i = 0; i < ops.length; i += 400) { const b = db.batch(); ops.slice(i, i + 400).forEach(f => f(b)); await b.commit(); }
    try { await auth.currentUser.delete(); }
    catch (e) { if (e.code === 'auth/requires-recent-login') { btn.disabled = false; return toast(L('सुरक्षा के लिए दोबारा Google से साइन-इन करके यह बटन फिर दबाएँ', 'For safety, sign in with Google again and tap this again')); } }
    try { Object.keys(localStorage).filter(k => k.indexOf('ls_') === 0).forEach(k => localStorage.removeItem(k)); } catch (e) {}
    location.reload();
  } catch (e) { btn.disabled = false; toast(L('हट नहीं पाया, दोबारा कोशिश करें', 'Could not delete, try again')); }
}

async function saathiApply(){
  const v = id => ($(id).value || '').trim();
  const name = v('#sa_name'), phone = v('#sa_phone'), city = v('#sa_city');
  if (!name || !city) return toast(L('नाम और शहर भरें', 'Fill name and town'));
  if (!/^[6-9]\d{9}$/.test(phone)) return toast(L('सही 10 अंकों का नंबर डालें', 'Enter a valid 10-digit number'));
  if (!$('#sa_ok').checked) return toast(L('शर्तों से सहमत होना ज़रूरी है', 'You must agree to the terms'));
  $('#sa_go').disabled = true;
  const AL = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  for (let t = 0; t < 4; t++) {
    const r = crypto.getRandomValues(new Uint8Array(6)); let code = ''; r.forEach(x => { code += AL[x % AL.length]; });
    try {
      const b = db.batch();
      b.set(db.collection('saathis').doc(S.uid), {name:name, phone:phone, city:city, code:code, status:'pending', createdAt:firebase.firestore.FieldValue.serverTimestamp()});
      b.set(db.collection('saathiCodes').doc(code), {uid:S.uid});
      await b.commit(); toast(L('आवेदन भेज दिया', 'Application sent')); return saathiLoad();
    } catch (e) { /* कोड टकराया तो दोबारा */ }
  }
  $('#sa_go').disabled = false; toast(L('भेज नहीं पाए, दोबारा कोशिश करें', 'Could not send, try again'));
}

  const star = w.slice(-1) === '*'; if (star) w = w.slice(0, -1);
  w = nz(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const latin = /^[a-z0-9' ]+$/.test(w);
  const re = latin ? '(^|[^a-z0-9])' + w + (star ? '' : '(?![a-z0-9])')
                   : '(^|[^\\u0900-\\u097F])' + w + (star ? '' : '(?![\\u0904-\\u0939\\u0958-\\u095F\\u094D])');
  return new RegExp(re).test(t);
}

function parseWhen(raw){

  return p.join(' ');
}

/* ---------- मुफ़्त-सीमा वाला LLM (वैकल्पिक, सिर्फ़ उलझी बातों के लिए) ---------- */
function llmBudget(){
  const d = new Date().toISOString().slice(0, 10); let o;
  try { o = JSON.parse(lsGet('ls_llm') || '{}'); } catch (e) { o = {}; }
  if (o.d !== d) o = {d:d, n:0, bad:0, until:0};
  return o;
}
function cleanLLM(t){
  if (typeof t !== 'string') return null;
  t = t.trim().slice(0, 320); if (!t) return null;
  if (/₹|रुपये|रुपए|rs\.?\s*\d|rupee|%|discount|छूट|फ्री|मुफ्त|free|गारंटी|guarantee|\d{6,}|https?:/i.test(nz(t))) return null;
  return t;
}
async function llmChat(a, text){
  if (!AI_ENDPOINT) return null;
  const o = llmBudget();
  if (o.n >= LLM_DAILY || Date.now() < (o.until || 0)) return null;
  o.n += 1; lsSet('ls_llm', JSON.stringify(o));
  try {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 7000);
    const r = await fetch(AI_ENDPOINT, {method:'POST', headers:{'Content-Type':'application/json'}, signal:ctl.signal,
      body:JSON.stringify({lang:S.lang, msg:text.slice(0, 300), hist:a.hist.slice(-5), stage:a.stage, svc:a.svc})});
    clearTimeout(to);
    if (!r.ok) throw new Error('http ' + r.status);
    const j = await r.json();
    return cleanLLM(j && j.reply);
  } catch (e) {
    o.bad = (o.bad || 0) + 1; if (o.bad >= 2) o.until = Date.now() + 10 * 60 * 1000;
    lsSet('ls_llm', JSON.stringify(o)); return null;
  }
}

  return opener(a.svc) + '\n' + svc(a.svc).emoji + ' ' + svcName(a.svc) + '\n✅ ' + L('सबसे अच्छा विकल्प: ', 'Best match: ') + p.name + ' (' + p.area + ')' +
    (p.verified === true ? ' ✔' : '') + (r ? ' ★' + r.avg.toFixed(1) : '') + '\n' + L('रेट: ', 'Rate: ') + p.rate +
    (lo < 1e9 ? '\n' + L('आम दायरा: ₹' + lo + ' से ₹' + hi, 'Usual range: ₹' + lo + ' to ₹' + hi) : '') + dist +
    (a.provs.length > 1 ? '\n(' + L((a.provs.length - 1) + ' और विकल्प हैं', (a.provs.length - 1) + ' more options') + ')' : '');
}
async function loadProvs(a){
  const res = await Promise.all([
    db.collection('providers').where('service', '==', a.svc).where('active', '==', true).get(),
    db.collection('reviews').where('service', '==', a.svc).get().catch(() => null)
  ]);
  const rate = {};
  if (res[1]) res[1].docs.forEach(d => { const r = d.data(); const e = rate[r.providerId] || (rate[r.providerId] = {sum:0, n:0}); e.sum += Number(r.rating) || 0; e.n += 1; });
  const docs = res[0].docs.map(d => Object.assign({id:d.id}, d.data()));
  docs.forEach(d => { S.cache[d.id] = d; if (rate[d.id]) S.rate[d.id] = rate[d.id]; });
  rankList(docs);
  a.provs = nearOnly(docs).docs;
}
function aiOther(){
  return aiRun(async a => {
    const i = (a.provs.indexOf(a.p) + 1) % a.provs.length;
    a.p = a.provs[i]; a.price = undefined; a.deal = null; a.intro = false;
    await aiNext(a);
  });
}
async function aiNext(a){
  if (!a.svc) {
    a.stage = 'need';
    await say('बताइए, कौन-सा काम करवाना है? जैसे: "नल टपक रहा है" या "कल सुबह नाई चाहिए"।', 'What do you need done? For example: "my tap is leaking" or "a barber tomorrow morning".');
    setChips(exChips()); return;
  }
  if (!a.provs) {
    try { await loadProvs(a); } catch (e) { await say('इंटरनेट की दिक्कत है, डेटा नहीं आया। थोड़ी देर बाद कोशिश करें।', 'There is a network problem and data did not load. Please try again shortly.'); return; }
    if (S.ai !== a) return;
  }
  if (!a.provs.length) {
    const nm = svcName(a.svc); a.svc = null; a.provs = null; a.stage = 'need';
    await say(nm + ' में अभी कोई प्रोवाइडर जुड़ा नहीं है। कोई और काम बताइए।', 'No provider has joined ' + nm + ' yet. Tell me something else.');
    setChips(exChips()); return;
  }
  if (!a.p) a.p = a.provs[0];
  if (!a.intro) { a.intro = true; await botSay(aiIntro(a)); if (S.ai !== a) return; }
  const other = a.provs.length > 1 ? [{t:L('🔄 दूसरा प्रोवाइडर', '🔄 Another provider'), fn:() => aiOther()}] : [];
  const locChip = !S.loc && VENUE.indexOf(a.svc) < 0 ? [{t:L('📍 मेरी जगह चालू करो', '📍 Use my location'), fn:() => getPos(p => { S.loc = p; lsSet('ls_loc', JSON.stringify(p)); const x = S.ai; if (x) { x.provs = null; x.p = null; x.intro = false; aiRun(y => aiNext(y)); } })}] : [];
  if (!S.loc && !a.askedLoc && locChip.length) { a.askedLoc = true; await say('पास का कारीगर पहले दिखाने के लिए अपनी जगह चालू कर दें, चाहें तो।', 'If you like, turn on your location so I can show the nearest provider first.'); }

  if (!a.when) {
    a.stage = 'when';
    await sayP([['कब चाहिए? जैसे: कल सुबह 10 बजे','When do you need it? For example: tomorrow 10 am'], ['किस समय आना ठीक रहेगा? आज, कल या कोई और दिन?','What time suits you? Today, tomorrow or another day?']]);
    setChips([L('आज शाम', 'Today evening'), L('कल सुबह', 'Tomorrow morning'), L('कल शाम', 'Tomorrow evening')].map(t => ({t:t, fn:() => aiHandle(t)})).concat(other, locChip)); return;
  }
  if (!a.addr) {
    a.stage = 'addr';
    await sayP([['आपका पता या मोहल्ला क्या है?','What is your address or locality?'], ['कारीगर को कहाँ आना है? मोहल्ला या पता बता दीजिए।','Where should the provider come? Please share your locality or address.']]);
    const last = lsGet('ls_addr');
    setChips((last ? [{t:'📍 ' + last.slice(0, 28), fn:() => aiHandle(last)}] : []).concat(other, locChip)); return;
  }
  if (a.bulk && !a.qty) {
    a.stage = 'qty';
    await say('कितनी मात्रा चाहिए? जैसे: 100 लीटर, 300 मेहमान, 5 कमरे', 'How much do you need? For example: 100 litres, 300 guests, 5 rooms');
    setChips(other); return;
  }
  if (canBargain(a.p) && a.price === undefined) {
    if (a.budget) { await aiBargain(a); return; }
    a.stage = 'price';
    await say('रेट ₹' + a.p.pMax + ' है, पर बात बन सकती है। आप कितना देना चाहेंगे? भाव बोलिए, या मैं आपकी तरफ़ से मोलभाव कर दूँ?', 'The rate is ₹' + a.p.pMax + ', but we can talk. What would you like to pay? Tell me a price, or shall I bargain for you?');
    setChips([{t:L('🤖 नेहा मोलभाव करे', '🤖 Let Neha bargain'), fn:() => aiRun(x => aiBargain(x))}, {t:L('👍 रेट ठीक है', '👍 Rate is fine'), fn:() => aiRun(async x => { x.price = Number(x.p.pMax); addBub('me', L('रेट ठीक है', 'Rate is fine')); await aiNext(x); })}]);
    return;
  }
  if (a.price === undefined) a.price = null;
  a.stage = 'confirm';
  const p = a.p, fee = p._fee || 0;
  await botSay(L('📋 बुकिंग तैयार:', '📋 Booking ready:') + '\n• ' + L('काम: ', 'Job: ') + svcName(a.svc) + '\n• ' + L('प्रोवाइडर: ', 'Provider: ') + p.name + '\n• ' + L('कब: ', 'When: ') + fmtWhen(a.when) + '\n• ' + L('पता: ', 'Address: ') + a.addr +
    (a.qty ? '\n• ' + L('मात्रा: ', 'Quantity: ') + a.qty : '') + (a.price ? '\n• ' + L('रेट: ', 'Rate: ') + '₹' + a.price + (a.deal ? L(' (मोलभाव से)', ' (bargained)') : '') : '') +
    (fee ? '\n• ' + L('यात्रा-शुल्क: ', 'Travel charge: ') + '₹' + fee + (a.price ? '\n• ' + L('कुल: ', 'Total: ') + '₹' + (a.price + fee) : '') : '') + '\n\n' + L('पक्का करूँ?', 'Shall I confirm?'));
  setChips([{t:L('✅ हाँ, बुक करो', '✅ Yes, book it'), fn:() => aiRun(x => aiConfirm(x))},
    {t:L('✏️ बदलें', '✏️ Change'), fn:() => aiRun(async x => { x.when = ''; x.addr = ''; x.price = undefined; x.deal = null; x.stage = 'need'; addBub('me', L('बदलना है', 'Change it')); await aiNext(x); })}].concat(other));
}

/* ---------- AI मोलभाव (ग्राहक की तरफ़ से, प्रोवाइडर की तय सीमा के भीतर) ---------- */
async function aiBargain(a){
  const p = a.p, mn = Number(p.pMin), mx = Number(p.pMax);
  const goal = a.budget || up5(mn * 1.1);
  let offer = Math.max(mn, a.budget ? Math.min(a.budget, mx) : mn), first = null, deal = null, round = 0;
  if (a.budget && a.budget < mn) await say('₹' + a.budget + ' इस काम के सबसे कम रेट से नीचे है। मैं सबसे कम संभव भाव से शुरू करती हूँ।', '₹' + a.budget + ' is below the lowest rate for this job. I will start from the lowest possible price.');
  await say('ठीक है, मैं आपकी तरफ़ से ' + p.name + ' के सहायक से बात करती हूँ। 🤝', 'Alright, I will talk to ' + p.name + '’s assistant on your behalf. 🤝');
  while (round < 3) {
    if (S.ai !== a) return;
    round += 1; if (first === null) first = offer;
    addBub('me', '🤖 ' + L('मेरी तरफ़ से: ₹', 'On your behalf: ₹') + offer);
    await sleep(400);
    const r = bargainReply(p, offer, round);
    if (r.deal) { deal = r.price; await say('सौदा पक्का: ₹' + deal + ' 🎉', 'Deal done: ₹' + deal + ' 🎉', 'deal'); break; }
    await say(p.name + ' का सहायक: ₹' + r.counter + ' में कर देंगे।', p.name + '’s assistant: they can do it for ₹' + r.counter + '.');
    if (r.counter <= goal || r.final) {
      deal = r.counter; addBub('me', '🤖 ₹' + deal + L(' मंज़ूर', ' accepted'));
      await say('सौदा पक्का: ₹' + deal + ' 🎉', 'Deal done: ₹' + deal + ' 🎉', 'deal'); break;
    }
    offer = Math.min(mx, Math.max(offer, up5(mn + (r.counter - mn) * 0.3)));
  }
  a.price = deal; a.deal = {price:deal, rounds:round, first:first};
  await aiNext(a);
}

/* ---------- बुकिंग पक्की ---------- */
async function aiConfirm(a){
  const p = a.p, deal = a.deal, offer = a.price || null, trip = tripOf(p);
  addBub('me', L('हाँ, बुक करो', 'Yes, book it')); setChips([]);
  try {
    await createBooking({
      customerId:S.uid, customerName:S.profile.name, customerPhone:S.profile.phone,
      providerId:p.id, providerName:p.name, providerPhone:'', service:p.service,
      address:a.addr, when:a.when, note:'🤖 हाज़िर AI सहायक से बुक', bulk:!!a.bulk, qty:a.bulk ? a.qty : '', offer:offer, status:'नया',
      bargained:!!deal, bargainRounds:deal ? deal.rounds : 0, firstOffer:deal ? deal.first : null,
      distKm:trip.km, travel:trip.fee,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch (e) {
    await say('बुकिंग नहीं हो पाई। इंटरनेट देखकर दोबारा कोशिश करें।', 'The booking did not go through. Check your internet and try again.');
    setChips([{t:L('🔁 दोबारा कोशिश', '🔁 Try again'), fn:() => aiRun(x => aiConfirm(x))}]); return;
  }
  lsSet('ls_addr', a.addr);
  a.stage = 'done'; a.booked = true;
  await say('✅ बुकिंग भेज दी। ' + p.name + ' स्वीकार करेंगे तो आपको "मेरी बुकिंग" में तुरंत दिख जाएगा। उनका नंबर और काम पूरा करने का 4 अंक का कोड भी वहीं दिखेगा।', '✅ Booking sent. When ' + p.name + ' accepts, you will see it in "My bookings" right away, with their number and a 4-digit completion code.');
  setChips([{t:L('🧾 मेरी बुकिंग', '🧾 My bookings'), fn:() => { closeSheet(); goBookings(); }}]);
}


/* ---------- शुरुआत ---------- */
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); S.installEv = e;
  if (S.uid && S.profile && !S.view && S.tab === 'home') render();
});
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
if (CONFIGURED) {
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth(); db = firebase.firestore();
  auth.getRedirectResult().catch(() => {});
  auth.onAuthStateChanged(u => { if (u) { S.uid = u.uid; render(); } });
  auth.signInAnonymously().catch(() => {
    $('#app').innerHTML = '<div class="center"><div style="font-size:48px">⚠️</div>जुड़ नहीं पाए।<br>Firebase में <b>Anonymous</b> साइन-इन चालू है या नहीं देखें।</div>';
  });
}
render();
</script>
